<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Life OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --parchment:#EDE3CC;
  --parchment-deep:#E0D2A8;
  --parchment-shadow:#CDBB8B;
  --ink:#2A2115;
  --ink-soft:#5A4C38;
  --gold:#A6791F;
  --gold-bright:#C99A34;
  --verdigris:#4C6B5C;
  --verdigris-deep:#385044;
  --oxblood:#7A2E2E;
  --oxblood-bright:#9A3B3B;
  --paper:#F6F0DE;
  --line:rgba(42,33,21,0.14);
  --shadow:0 8px 24px rgba(42,33,21,0.14);
  --shadow-lg:0 16px 40px rgba(42,33,21,0.22);
  --radius:10px;
  --font-display:'Fraunces', 'Cormorant Garamond', serif;
  --font-body:'EB Garamond', 'Cormorant Garamond', serif;
  --font-ui:'Inter', sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(166,121,31,0.08), transparent 60%),
    radial-gradient(1000px 600px at 100% 0%, rgba(76,107,92,0.07), transparent 55%),
    var(--parchment);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--gold); color:var(--paper); }
a{ color:inherit; }
button{ font-family:var(--font-ui); cursor:pointer; }
input,textarea,select{ font-family:var(--font-body); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--parchment-shadow); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ---------- Layout ---------- */
#app{ display:flex; min-height:100vh; }

.sidebar{
  width:236px; flex-shrink:0;
  background:linear-gradient(180deg, var(--ink) 0%, #241a10 100%);
  color:var(--parchment);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  z-index:40;
}
.sidebar .brand{
  padding:26px 22px 18px;
  border-bottom:1px solid rgba(237,227,204,0.14);
}
.sidebar .brand .mark{
  font-family:var(--font-display); font-size:15px; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--gold-bright); margin-bottom:4px;
}
.sidebar .brand .title{
  font-family:var(--font-display); font-weight:600; font-size:22px; line-height:1.15;
}
.sidebar nav{ padding:14px 12px; flex:1; }
.nav-group-label{
  font-family:var(--font-ui); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
  color:rgba(237,227,204,0.45); padding:16px 12px 6px;
}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 12px; border-radius:8px; margin:2px 4px;
  font-family:var(--font-ui); font-size:14px; font-weight:500;
  color:rgba(237,227,204,0.82); text-decoration:none;
  transition:background 0.15s ease, color 0.15s ease;
  border:none; background:transparent; width:calc(100% - 8px); text-align:left;
}
.nav-item .ic{ width:18px; text-align:center; opacity:0.85; font-size:14px; }
.nav-item:hover{ background:rgba(237,227,204,0.08); color:var(--parchment); }
.nav-item.active{ background:rgba(201,154,52,0.18); color:var(--gold-bright); }
.sidebar .foot{ padding:14px 22px 20px; font-size:11px; color:rgba(237,227,204,0.35); font-family:var(--font-ui); border-top:1px solid rgba(237,227,204,0.1); }

.main{ flex:1; min-width:0; display:flex; flex-direction:column; }

.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:14px;
  padding:14px 28px; background:rgba(237,227,204,0.86); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar .menu-btn{ display:none; background:none; border:none; font-size:20px; color:var(--ink); padding:4px; }
.search-box{
  flex:1; max-width:420px; display:flex; align-items:center; gap:8px;
  background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:8px 14px;
}
.search-box input{ border:none; background:none; outline:none; flex:1; font-size:14px; color:var(--ink); }
.search-box .ic{ opacity:0.55; }
.topbar-spacer{ flex:1; }
.save-status{
  font-family:var(--font-ui); font-size:12px; color:var(--verdigris-deep);
  display:flex; align-items:center; gap:6px; opacity:0; transition:opacity 0.3s ease;
}
.save-status.show{ opacity:1; }
.save-status .dot{ width:6px; height:6px; border-radius:50%; background:var(--verdigris); }
.btn-quickadd{
  font-family:var(--font-ui); font-weight:600; font-size:13px;
  background:var(--oxblood); color:var(--paper); border:none; border-radius:20px;
  padding:9px 16px; display:flex; align-items:center; gap:6px; box-shadow:var(--shadow);
  transition:transform 0.12s ease, background 0.15s ease;
}
.btn-quickadd:hover{ background:var(--oxblood-bright); transform:translateY(-1px); }

.content{ padding:28px 32px 80px; max-width:1280px; width:100%; margin:0 auto; }

.page-header{ margin-bottom:22px; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.page-eyebrow{ font-family:var(--font-ui); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
.page-title{ font-family:var(--font-display); font-weight:600; font-size:34px; color:var(--ink); }
.page-sub{ font-family:var(--font-body); font-size:15px; color:var(--ink-soft); margin-top:4px; }

.breadcrumb{ font-family:var(--font-ui); font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.breadcrumb a{ color:var(--verdigris-deep); text-decoration:none; }
.breadcrumb a:hover{ text-decoration:underline; }
.breadcrumb .sep{ opacity:0.4; }

/* ---------- Cards / grid ---------- */
.grid{ display:grid; gap:18px; }
.grid.cols-4{ grid-template-columns:repeat(4,1fr); }
.grid.cols-3{ grid-template-columns:repeat(3,1fr); }
.grid.cols-2{ grid-template-columns:repeat(2,1fr); }
@media(max-width:1100px){ .grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);} }
@media(max-width:680px){ .grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;} }

.card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.card::before{
  content:""; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,var(--gold),var(--verdigris));
  opacity:0.7;
}
.card-click{ cursor:pointer; transition:transform 0.15s ease, box-shadow 0.15s ease; }
.card-click:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); }

.panel{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
.panel-title{ font-family:var(--font-display); font-weight:600; font-size:18px; margin:0 0 12px; display:flex; align-items:center; justify-content:space-between; gap:8px; }

.small-cap{ font-family:var(--font-ui); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft); }

/* ---------- Buttons ---------- */
.btn{
  font-family:var(--font-ui); font-weight:600; font-size:13px; border-radius:8px; border:1px solid transparent;
  padding:8px 14px; display:inline-flex; align-items:center; gap:6px; transition:all 0.15s ease; background:none;
}
.btn-primary{ background:var(--verdigris); color:var(--paper); }
.btn-primary:hover{ background:var(--verdigris-deep); }
.btn-ghost{ background:transparent; color:var(--ink-soft); border-color:var(--line); }
.btn-ghost:hover{ background:rgba(42,33,21,0.05); color:var(--ink); }
.btn-danger{ background:transparent; color:var(--oxblood); border-color:rgba(122,46,46,0.3); }
.btn-danger:hover{ background:rgba(122,46,46,0.08); }
.btn-sm{ padding:5px 10px; font-size:12px; }
.icon-btn{ background:none; border:none; color:var(--ink-soft); padding:5px 7px; border-radius:6px; font-size:14px; }
.icon-btn:hover{ background:rgba(42,33,21,0.07); color:var(--ink); }

/* ---------- Progress ---------- */
.progress-track{ height:8px; background:var(--parchment-shadow); border-radius:6px; overflow:hidden; }
.progress-fill{ height:100%; background:linear-gradient(90deg,var(--verdigris),var(--gold)); border-radius:6px; transition:width 0.4s ease; }
.progress-row{ display:flex; align-items:center; gap:10px; }
.progress-pct{ font-family:var(--font-ui); font-weight:700; font-size:13px; color:var(--verdigris-deep); min-width:38px; text-align:right; }

/* ---------- Inline editable ---------- */
[contenteditable]{ outline:none; }
[contenteditable]:hover{ background:rgba(166,121,31,0.06); border-radius:4px; }
[contenteditable]:focus{ background:rgba(166,121,31,0.1); border-radius:4px; box-shadow:0 0 0 2px rgba(166,121,31,0.25); }
.editable-hint{ font-size:11px; color:var(--ink-soft); opacity:0; transition:opacity 0.15s; }
.editable-wrap:hover .editable-hint{ opacity:0.6; }

input.field, textarea.field, select.field{
  width:100%; border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:14px;
  background:var(--parchment); color:var(--ink); transition:border 0.15s ease, background 0.15s ease;
}
input.field:focus, textarea.field:focus, select.field:focus{ outline:none; border-color:var(--gold); background:var(--paper); }
label.flabel{ font-family:var(--font-ui); font-size:11.5px; letter-spacing:0.04em; color:var(--ink-soft); display:block; margin-bottom:5px; }
.field-group{ margin-bottom:14px; }

.checkbox{ width:18px; height:18px; accent-color:var(--verdigris); cursor:pointer; flex-shrink:0; }

.empty-state{
  text-align:center; padding:48px 20px; color:var(--ink-soft);
  border:1.5px dashed var(--parchment-shadow); border-radius:var(--radius); background:rgba(246,240,222,0.4);
}
.empty-state .glyph{ font-size:30px; margin-bottom:10px; opacity:0.6; }
.empty-state .msg{ font-family:var(--font-display); font-size:17px; color:var(--ink); margin-bottom:14px; }

.pill{ font-family:var(--font-ui); font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; display:inline-block; }
.pill-gold{ background:rgba(166,121,31,0.15); color:var(--gold); }
.pill-verd{ background:rgba(76,107,92,0.15); color:var(--verdigris-deep); }
.pill-ox{ background:rgba(122,46,46,0.13); color:var(--oxblood); }
.pill-gray{ background:rgba(42,33,21,0.08); color:var(--ink-soft); }

/* ---------- Modal / Drawer ---------- */
.overlay{ position:fixed; inset:0; background:rgba(24,18,10,0.45); backdrop-filter:blur(2px); z-index:100; display:flex; align-items:center; justify-content:center; animation:fadeIn 0.15s ease; }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.modal{ background:var(--paper); border-radius:14px; box-shadow:var(--shadow-lg); width:min(480px,92vw); padding:24px; animation:popIn 0.18s ease; max-height:88vh; overflow-y:auto; }
@keyframes popIn{ from{opacity:0; transform:translateY(8px) scale(0.98);} to{opacity:1; transform:none;} }
.modal.modal-lg{ width:min(680px,94vw); }
.modal h3{ font-family:var(--font-display); font-size:20px; margin:0 0 14px; }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }

.drawer-overlay{ position:fixed; inset:0; background:rgba(24,18,10,0.35); z-index:90; animation:fadeIn 0.15s ease; }
.drawer{
  position:fixed; top:0; right:0; height:100vh; width:min(560px,92vw); background:var(--paper);
  box-shadow:-12px 0 40px rgba(24,18,10,0.25); z-index:95; overflow-y:auto;
  animation:slideIn 0.22s cubic-bezier(.16,1,.3,1);
}
@keyframes slideIn{ from{transform:translateX(100%);} to{transform:translateX(0);} }
.drawer-head{ position:sticky; top:0; background:var(--paper); border-bottom:1px solid var(--line); padding:18px 22px; display:flex; align-items:center; justify-content:space-between; z-index:2; }
.drawer-body{ padding:20px 22px 60px; }

.toast{ position:fixed; bottom:22px; right:22px; background:var(--ink); color:var(--parchment); font-family:var(--font-ui); font-size:13px; padding:11px 18px; border-radius:8px; box-shadow:var(--shadow-lg); z-index:200; animation:toastIn 0.2s ease; }
@keyframes toastIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

/* ---------- Curriculum / list rows ---------- */
.item-row{ display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line); }
.item-row:last-child{ border-bottom:none; }
.item-row .txt{ flex:1; font-size:14.5px; }
.item-row .txt.done{ text-decoration:line-through; color:var(--ink-soft); opacity:0.7; }
.row-actions{ display:flex; gap:2px; opacity:0; transition:opacity 0.12s; }
.item-row:hover .row-actions{ opacity:1; }

/* ---------- Dashboard mood/quick ---------- */
.mood-picker{ display:flex; gap:8px; flex-wrap:wrap; }
.mood-opt{ font-size:22px; padding:8px 10px; border-radius:10px; border:1.5px solid transparent; background:var(--parchment); transition:all 0.12s ease; }
.mood-opt:hover{ transform:translateY(-2px); }
.mood-opt.selected{ border-color:var(--gold); background:rgba(166,121,31,0.15); }

/* ---------- Calendar ---------- */
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-dow{ font-family:var(--font-ui); font-size:11px; text-align:center; color:var(--ink-soft); padding:4px 0; text-transform:uppercase; letter-spacing:0.05em; }
.cal-day{ min-height:84px; border:1px solid var(--line); border-radius:8px; padding:6px; background:var(--parchment); cursor:pointer; transition:background 0.12s ease; position:relative; }
.cal-day:hover{ background:var(--parchment-deep); }
.cal-day.empty{ background:transparent; border-color:transparent; cursor:default; }
.cal-day.today{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; }
.cal-day .num{ font-family:var(--font-ui); font-size:12px; font-weight:600; color:var(--ink-soft); }
.cal-day .evt{ font-size:10.5px; background:var(--verdigris); color:var(--paper); border-radius:4px; padding:1px 5px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cal-nav{ display:flex; align-items:center; gap:10px; }
.cal-dow.weekend{ color:var(--oxblood); font-weight:700; }
.cal-day.weekend{ background:#DDD0B5; }
.cal-day.weekend:hover{ background:#CFC0A1; }
.cal-day.selected-date{ border-color:var(--verdigris); box-shadow:0 0 0 2px rgba(76,107,92,0.18) inset; }

.gallery-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.gallery-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:14px; }
.gallery-card{ background:var(--paper); border:1px solid var(--line); border-radius:10px; overflow:hidden; box-shadow:var(--shadow); cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; }
.gallery-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); }
.gallery-thumb{ aspect-ratio:4/3; width:100%; object-fit:cover; display:block; background:var(--parchment); }
.gallery-meta{ padding:10px 12px 12px; }
.gallery-meta .name{ font-family:var(--font-display); font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gallery-meta .date{ font-family:var(--font-ui); font-size:10.5px; color:var(--ink-soft); margin-top:3px; }
.gallery-empty{ padding:34px 20px; text-align:center; border:1.5px dashed var(--parchment-shadow); border-radius:10px; }
.album-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
.album-card{ background:var(--parchment); border:1px solid var(--line); border-radius:10px; padding:14px; cursor:pointer; transition:.15s ease; }
.album-card:hover{ background:var(--parchment-deep); transform:translateY(-1px); }
.album-card.active{ border-color:var(--verdigris); box-shadow:0 0 0 2px rgba(76,107,92,.12) inset; }
.album-title{ font-family:var(--font-display); font-size:18px; }
.gallery-photo-layout{ display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:18px; align-items:start; }
.gallery-photo-view{ background:#241a10; border-radius:10px; min-height:50vh; display:flex; align-items:center; justify-content:center; padding:10px; }
.gallery-photo-view img{ max-width:100%; max-height:72vh; object-fit:contain; border-radius:6px; }
.sticky-note{ background:#F4E6A8; color:#4A3A17; border:1px solid rgba(90,76,56,.15); padding:14px; min-height:220px; box-shadow:4px 6px 16px rgba(42,33,21,.14); transform:rotate(-1deg); }
.sticky-note textarea{ background:transparent; border:none; resize:vertical; min-height:160px; width:100%; color:inherit; outline:none; font-family:var(--font-body); font-size:15px; }
.gallery-sort{ display:flex; align-items:center; gap:8px; font-family:var(--font-ui); font-size:12px; }
@media(max-width:760px){ .gallery-photo-layout{grid-template-columns:1fr;} .gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }


/* ---------- Weekly plan ---------- */
.week-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:12px; }
@media(max-width:1000px){ .week-grid{ grid-template-columns:repeat(2,1fr); } }
@media(max-width:560px){ .week-grid{ grid-template-columns:1fr; } }
.week-col{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px; min-height:180px; }
.week-col h4{ font-family:var(--font-display); font-size:15px; margin:0 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line); }

/* ---------- Recipe blocks ---------- */
.block{ border:1px solid transparent; border-radius:8px; padding:8px 10px; margin-bottom:6px; position:relative; }
.block:hover{ border-color:var(--line); background:rgba(246,240,222,0.5); }
.block-controls{ position:absolute; top:6px; right:6px; display:flex; gap:2px; opacity:0; }
.block:hover .block-controls{ opacity:1; }
.block h2, .block h3{ font-family:var(--font-display); margin:4px 0; }
.add-block-bar{ display:flex; gap:6px; flex-wrap:wrap; padding:10px 0; }

/* ---------- Travel board ---------- */
.trip-cover{ height:130px; border-radius:8px 8px 0 0; background:linear-gradient(135deg,var(--verdigris),var(--gold)); background-size:cover; background-position:center; margin:-18px -18px 12px; }
.day-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.day-tab{ font-family:var(--font-ui); font-size:13px; font-weight:600; padding:7px 14px; border-radius:20px; background:var(--parchment); border:1px solid var(--line); color:var(--ink-soft); }
.day-tab.active{ background:var(--verdigris); color:var(--paper); border-color:var(--verdigris); }

/* ---------- Search results ---------- */
.result-row{ padding:12px 4px; border-bottom:1px solid var(--line); }
.result-row .kind{ font-family:var(--font-ui); font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--gold); }
.result-row .title{ font-family:var(--font-display); font-size:16px; margin:2px 0; }
.result-row .snippet{ font-size:13.5px; color:var(--ink-soft); }

/* ---------- Responsive ---------- */
@media(max-width:880px){
  .sidebar{ position:fixed; left:-260px; transition:left 0.2s ease; box-shadow:var(--shadow-lg); }
  .sidebar.open{ left:0; }
  .topbar .menu-btn{ display:block; }
  .content{ padding:20px 16px 90px; }
  .page-title{ font-size:26px; }
}
.sidebar-scrim{ display:none; }
.sidebar-scrim.show{ display:block; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:39; }

.bottom-nav{ display:none; }
@media(max-width:640px){
  .bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:50;
    background:var(--ink); padding:6px 4px 10px; justify-content:space-around;
  }
  .bottom-nav a{ display:flex; flex-direction:column; align-items:center; gap:2px; color:rgba(237,227,204,0.6); text-decoration:none; font-family:var(--font-ui); font-size:9.5px; padding:4px 6px; }
  .bottom-nav a.active{ color:var(--gold-bright); }
  .bottom-nav .ic{ font-size:16px; }
}

textarea.field{ resize:vertical; min-height:70px; }
.fine{ font-size:12px; color:var(--ink-soft); }
.mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;} .mt20{margin-top:20px;}
hr.divider{ border:none; border-top:1px solid var(--line); margin:14px 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   PERSONAL LIFE OS — data layer, router, renderer
   ============================================================ */

/* ---------------- Utilities ---------------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateShort(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function debounce(fn,ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a),ms); }; }

/* ---------------- Persistent data layer ---------------- */
const DB_KEY='lifeos_db_v1';
function defaultDB(){
  return {
    learningGoals: [],
    youtubeIdeas: [],
    recipes: [],
    tasks: [],
    events: [],
    weeklyPlans: {},      // weekStartISO -> { Mon:[...], Tue:[...], ... }
    wishlist: [],
    trips: [],
    monthlyReviews: {},   // 'YYYY-MM' -> {...}
    moods: [],            // {id,date,mood,note,tags}
    journals: [],         // {id,date,title,content,updatedAt}
    galleryAlbums: [],    // {id,name,createdAt,updatedAt,photos:[{id,name,date,note,blobKey}]}
    lookbooks: [], // {id,season:'winter'|'summer'|'thin', name, head, upper, lower, accessories, notes, url, photo, createdAt, updatedAt}
    lookbook: {}, // legacy (ignored)
    quickNote: '',
    ytTypes: ['Vlog','Travel','Tutorial','Lifestyle','Story','Review','Other']
  };
}
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultDB(), parsed);
  }catch(e){ console.error('DB load failed', e); return defaultDB(); }
}
let db = loadDB();
let saveTimer=null;
function persist(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    flashSaved();
  }catch(e){
    console.error('DB save failed', e);
    toast('Could not save — storage may be full.');
  }
}
const persistDebounced = debounce(persist, 450);
function flashSaved(){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.textContent = 'Saved ✓';
  el.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>el.classList.remove('show'), 1400);
}
function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}

/* ---------------- Gallery storage (IndexedDB) ---------------- */
let galleryDbPromise = null;
function openGalleryDB(){
  if(!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB unavailable'));
  if(galleryDbPromise) return galleryDbPromise;
  galleryDbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open('lifeos_gallery_v1',1);
    req.onupgradeneeded = () => {
      const idb = req.result;
      if(!idb.objectStoreNames.contains('images')) idb.createObjectStore('images');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return galleryDbPromise;
}
function idbPutImage(key, blob){
  return openGalleryDB().then(idb=>new Promise((resolve,reject)=>{
    const tx=idb.transaction('images','readwrite'); tx.objectStore('images').put(blob,key);
    tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
  }));
}
function idbGetImage(key){
  return openGalleryDB().then(idb=>new Promise((resolve,reject)=>{
    const tx=idb.transaction('images','readonly'); const req=tx.objectStore('images').get(key);
    req.onsuccess=()=>resolve(req.result||null); req.onerror=()=>reject(req.error);
  }));
}
function idbDeleteImage(key){
  return openGalleryDB().then(idb=>new Promise((resolve,reject)=>{
    const tx=idb.transaction('images','readwrite'); tx.objectStore('images').delete(key);
    tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
  }));
}
function findGalleryAlbum(id){ return db.galleryAlbums.find(a=>a.id===id); }
function findGalleryPhoto(albumId,photoId){
  const a=findGalleryAlbum(albumId);
  return a ? a.photos.find(p=>p.id===photoId) : null;
}
function addGalleryAlbum(name){
  const now=Date.now();
  const a={id:uid(),name:(name||'New Album').trim()||'New Album',createdAt:now,updatedAt:now,photos:[]};
  db.galleryAlbums.unshift(a); persist(); return a;
}
function galleryPhotoSort(photos,mode){
  return [...photos].sort((a,b)=> mode==='name'
    ? a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'})
    : (b.date||'').localeCompare(a.date||''));
}
async function saveGalleryFiles(albumId,files){
  const album=findGalleryAlbum(albumId);
  if(!album || !files.length) return;
  const remaining=500-album.photos.length;
  if(remaining<=0){ toast('This album has reached the 500-photo limit.'); return; }
  const batch=[...files].filter(f=>f.type.startsWith('image/')).slice(0,remaining);
  for(const file of batch){
    const id=uid(), key=albumId+'__'+id;
    await idbPutImage(key,file);
    album.photos.push({id,name:file.name,date:new Date().toISOString(),note:'',blobKey:key});
  }
  album.updatedAt=Date.now(); persist(); render();
  toast(`${batch.length} photo${batch.length>1?'s':''} added`);
}
async function hydrateGalleryImages(){
  document.querySelectorAll('[data-gallery-key]').forEach(async img=>{
    try{
      const blob=await idbGetImage(img.getAttribute('data-gallery-key'));
      if(blob){ const url=URL.createObjectURL(blob); img.src=url; img.onload=()=>URL.revokeObjectURL(url); }
    }catch(e){ console.error('Gallery image load failed',e); }
  });
  const modalImg=document.querySelector('[data-gallery-modal-key]');
  if(modalImg){
    try{
      const blob=await idbGetImage(modalImg.getAttribute('data-gallery-modal-key'));
      if(blob) modalImg.src=URL.createObjectURL(blob);
    }catch(e){ console.error('Gallery modal image load failed',e); }
  }
}

function getWeekStart(iso){
  const d = new Date(iso+'T00:00:00');
  const day = d.getDay(); // 0 Sun .. 6 Sat
  const diff = (day===0? -6 : 1-day); // move to Monday
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

const WEEK_DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function getWeekPlan(weekStart){
  if(!db.weeklyPlans[weekStart]){
    const wp={}; WEEK_DAYS.forEach(d=>wp[d]=[]);
    db.weeklyPlans[weekStart]=wp;
  }
  return db.weeklyPlans[weekStart];
}
function weekProgress(weekStart){
  const wp = getWeekPlan(weekStart);
  let total=0, done=0;
  WEEK_DAYS.forEach(d=>{ wp[d].forEach(it=>{ total++; if(it.done) done++; }); });
  return {total,done,pct: total? Math.round((done/total)*1000)/10 : 0};
}

   GLOBAL SEARCH
   ============================================================ */
function globalSearch(q){
  q=q.trim().toLowerCase();
  if(!q) return [];
  const res=[];
  db.learningGoals.forEach(g=>{
    if((g.title+g.goal).toLowerCase().includes(q)) res.push({kind:'Learning Goal', title:g.title, snippet:g.goal, hash:`#/learning/goal/${g.id}`});
  });
  db.youtubeIdeas.forEach(v=>{
    if((v.title+v.type).toLowerCase().includes(q)) res.push({kind:'YouTube Idea', title:v.title, snippet:v.status, hash:`#/youtube/idea/${v.id}`});
    v.script.forEach(s=>{ if((s.name+s.content).toLowerCase().includes(q)) res.push({kind:'Script', title:v.title+' — '+s.name, snippet:s.content.slice(0,80), hash:`#/youtube/idea/${v.id}/script`}); });
  });
  db.recipes.forEach(r=>{
    if(r.title.toLowerCase().includes(q)) res.push({kind:'Recipe', title:r.title, snippet:'', hash:`#/recipes/${r.id}`});
  });
  db.tasks.forEach(t=>{
    if((t.title+t.notes).toLowerCase().includes(q)) res.push({kind:'Task', title:t.title, snippet:t.notes, hash:`#/calendar`});
  });
  db.trips.forEach(t=>{
    if((t.name+t.destination).toLowerCase().includes(q)) res.push({kind:'Trip', title:t.name, snippet:t.destination, hash:`#/travel/${t.id}`});
  });
  db.galleryAlbums.forEach(a=>{
    if(a.name.toLowerCase().includes(q)) res.push({kind:'Gallery', title:a.name, snippet:`${a.photos.length} photos`, hash:`#/gallery/album/${a.id}`});
  });
  if(db.quickNote && db.quickNote.toLowerCase().includes(q)) res.push({kind:'Note', title:'Quick Note', snippet:db.quickNote.slice(0,80), hash:'#/dashboard'});
  return res;
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render(){
  const route = currentRoute();
  if(route.length===0){ location.hash = '#/dashboard'; return; }
  const page = route[0];
  let pageHTML='';
  try{
    if(page==='dashboard') pageHTML = renderDashboard();
    else if(page==='gallery') pageHTML = renderGallery(route);
    else if(page==='learning') pageHTML = renderLearning(route);
    else if(page==='youtube') pageHTML = renderYoutube(route);
    else if(page==='recipes') pageHTML = renderRecipes(route);
    else if(page==='calendar') pageHTML = renderCalendar(route);
    else if(page==='weekly') pageHTML = renderWeekly(route);
    else if(page==='wishlist') pageHTML = renderWishlist();
    else if(page==='lookbook') pageHTML = renderLookbook(route);
    else if(page==='travel') pageHTML = renderTravel(route);
    else if(page==='review') pageHTML = renderReview(route);
    else if(page==='mood') pageHTML = renderMood();
    else if(page==='search') pageHTML = renderSearch(route);
    else pageHTML = `<div class="empty-state"><div class="glyph">✦</div><div class="msg">Page not found</div><a class="btn btn-primary" href="#/dashboard">Return to Dashboard</a></div>`;
  }catch(e){
    console.error(e);
    pageHTML = `<div class="empty-state"><div class="glyph">⚠</div><div class="msg">Something went wrong rendering this page.</div><a class="btn btn-primary" href="#/dashboard">Return to Dashboard</a></div>`;
  }

  document.getElementById('app').innerHTML = `
    ${sidebarHTML(route)}
    <div class="main">
      ${topbarHTML()}
      <div class="content">${pageHTML}</div>
      ${bottomNavHTML(route)}
    </div>
    ${ui.drawer? renderDrawer() : ''}
    ${ui.modal? renderModal() : ''}
  `;
  wireInputs();
  // restore search input focus caret if it was mid-typing is not needed since we don't rerender on that input's own event
}

/* ============================================================
   Reusable: bind data-bind inputs (do NOT trigger full render on input)
   ============================================================ */
function wireInputs(){
  document.querySelectorAll('[data-bind]').forEach(el=>{
    const evtName = (el.tagName==='SELECT' || el.type==='checkbox' || el.type==='date' || el.type==='time' || el.type==='radio') ? 'change' : 'input';
    el.addEventListener(evtName, (e)=>handleBind(el, e));
  });
  document.querySelectorAll('[data-bind-blur]').forEach(el=>{
    el.addEventListener('blur', (e)=>handleBindBlur(el,e));
  });
  const fi = document.getElementById('firstFocus');
  if(fi){ fi.focus(); if(fi.select) try{fi.select();}catch(e){} }

  // dynamic image file inputs
  const recipeImg = document.getElementById('recipeImgInput');
  if(recipeImg){ const rid = currentRoute()[1]; bindImageFile(recipeImg, dataUrl=>{ const r=findRecipe(rid); if(r) r.image=dataUrl; }); }
  document.querySelectorAll('.recipeBlockImgInput').forEach(inp=>{
    bindImageFile(inp, dataUrl=>{ const r=findRecipe(inp.getAttribute('data-rid')); const b=r&&r.blocks.find(x=>x.id===inp.getAttribute('data-bid')); if(b) b.url=dataUrl; });
  });
  document.querySelectorAll('.wishImgInput').forEach(inp=>{
    bindImageFile(inp, dataUrl=>{ const w=findWish(inp.getAttribute('data-wid')); if(w) w.image=dataUrl; });
  });
  const tripCover = document.getElementById('tripCoverInput');
  if(tripCover){ bindImageFile(tripCover, dataUrl=>{ const t=findTrip(tripCover.getAttribute('data-tid')); if(t) t.cover=dataUrl; }); }
  const galleryUpload = document.getElementById('galleryUploadInput');
  if(galleryUpload){
    const albumId = currentRoute()[2];
    galleryUpload.addEventListener('change', ()=>{ if(galleryUpload.files.length) saveGalleryFiles(albumId,galleryUpload.files); });
  }
  document.querySelectorAll('.lookDetailImgInput').forEach(inp=>{
    bindImageFile(inp, dataUrl=>{
      const look = findLook(inp.getAttribute('data-lid'));
      if(look){ look.photo=dataUrl; look.updatedAt=Date.now(); persist(); render(); }
    });
  });
  document.querySelectorAll('.lookPartImgInput').forEach(inp=>{
    bindImageFile(inp, dataUrl=>{
      const look = findLook(inp.getAttribute('data-lid'));
      const part = inp.getAttribute('data-part');
      if(look && part){ normalizeLook(look); look[part].photo=dataUrl; look.updatedAt=Date.now(); persist(); render(); }
    });
  });
  hydrateGalleryImages();
}

function handleBind(el, e){
  const spec = el.getAttribute('data-bind');
  const parts = spec.split('::');
  const key = parts[0];
  const isCE = el.isContentEditable || el.getAttribute('contenteditable')==='true';
  const val = el.type==='checkbox' ? el.checked : (isCE ? el.innerText : el.value);

  if(key==='search'){ ui.searchQuery = val; return; } // no persist, handled on submit
  if(key==='journalQuery'){ ui.journalQuery = val; return; }
  if(key==='ytSearchQuery'){ ui.ytSearchQuery = val; return; }
  if(key==='ytTypeFilter'){ ui.ytTypeFilter = val; render(); return; }
  if(key==='quicknote'){ db.quickNote = val; persistDebounced(); return; }

  if(key.startsWith('goal.')){
    const g = findGoal(parts[1]); if(!g) return;
    const field = key.split('.')[1];
    g[field] = val; g.updatedAt = Date.now(); persistDebounced(); return;
  }
  if(key.startsWith('curriculum.')){
    const g = findGoal(parts[1]); if(!g) return;
    const c = g.curriculum.find(x=>x.id===parts[2]); if(!c) return;
    c.text = val; g.updatedAt = Date.now(); persistDebounced(); return;
  }
  if(key.startsWith('idea.')){
    const v = findIdea(parts[1]); if(!v) return;
    const field = key.split('.')[1];
    v[field] = val; v.updatedAt = Date.now(); persistDebounced(); return;
  }
  if(key.startsWith('script.')){
    const v = findIdea(parts[1]); if(!v) return;
    const s = v.script.find(x=>x.id===parts[2]); if(!s) return;
    const field = key.split('.')[1];
    s[field] = val; v.updatedAt = Date.now(); persistDebounced(); return;
  }
  if(key.startsWith('recipe.')){
    const r = findRecipe(parts[1]); if(!r) return;
    const field = key.split('.')[1];
    r[field] = field==='rating' ? (parseInt(val,10)||0) : val;
    r.updatedAt = Date.now(); persistDebounced(); return;
  }
  if(key.startsWith('block.')){
    const r = findRecipe(parts[1]); if(!r) return;
    const b = r.blocks.find(x=>x.id===parts[2]); if(!b) return;
    const field = key.split('.')[1];
    b[field] = val; r.updatedAt = Date.now(); persistDebounced(); return;
  }
  if(key.startsWith('blockitem.')){
    const r = findRecipe(parts[1]); if(!r) return;
    const b = r.blocks.find(x=>x.id===parts[2]); if(!b) return;
    const it = b.items.find(x=>x.id===parts[3]); if(!it) return;
    it.text = val; r.updatedAt = Date.now(); persistDebounced(); return;
  }
  if(key.startsWith('task.')){
    const t = findTask(parts[1]); if(!t) return;
    const field = key.split('.')[1];
    t[field] = val; persistDebounced(); if(field==='dueDate'||field==='priority') render(); return;
  }
  if(key.startsWith('event.')){
    const ev = findEvent(parts[1]); if(!ev) return;
    const field = key.split('.')[1];
    ev[field] = val; persistDebounced(); return;
  }
  if(key.startsWith('weekitem.')){
    const wp = getWeekPlan(parts[1]); const day=parts[2];
    const it = wp[day].find(x=>x.id===parts[3]); if(!it) return;
    it.text = val; persistDebounced(); return;
  }
  if(key.startsWith('wish.')){
    const w = findWish(parts[1]); if(!w) return;
    const field = key.split('.')[1];
    w[field] = field==='price' ? (parseFloat(val)||0) : val;
    persistDebounced(); if(field==='price') render(); return;
  }
  if(key.startsWith('trip.')){
    const t = findTrip(parts[1]); if(!t) return;
    const field = key.split('.')[1];
    t[field] = val; persistDebounced(); return;
  }
  if(key.startsWith('day.')){
    const t = findTrip(parts[1]); if(!t) return;
    const d = t.days.find(x=>x.id===parts[2]); if(!d) return;
    d.label = val; persistDebounced(); return;
  }
  if(key.startsWith('dayitem.')){
    const t = findTrip(parts[1]); if(!t) return;
    const d = t.days.find(x=>x.id===parts[2]); if(!d) return;
    const it = d.items.find(x=>x.id===parts[3]); if(!it) return;
    const field = key.split('.')[1];
    it[field] = val; persistDebounced(); return;
  }
  if(key.startsWith('review.')){
    const ym = parts[1];
    ensureReview(ym);
    const field = key.split('.')[1];
    db.monthlyReviews[ym][field] = (field.startsWith('rating') || field==='overall') ? (parseInt(val,10)||5) : val;
    persistDebounced(); return;
  }
  if(key.startsWith('mood.')){
    const date = parts[1];
    let m = db.moods.find(x=>x.date===date);
    if(!m){ m={id:uid(),date,mood:'',note:'',tags:[]}; db.moods.push(m); }
    m.note = val; persistDebounced(); return;
  }
  if(key.startsWith('journal.')){
    const date=parts[1]; const j=getJournalForDate(date); const field=key.split('.')[1];
    j[field]=val; j.updatedAt=Date.now(); persistDebounced(); return;
  }
  if(key==='gallery.note'){
    const albumId=parts[1], photoId=parts[2]; const ph=findGalleryPhoto(albumId,photoId);
    if(ph){ ph.note=val; const al=findGalleryAlbum(albumId); if(al) al.updatedAt=Date.now(); persistDebounced(); }
    return;
  }
  if(key==='lookbookQuery'){ ui.lookbookQuery = val; return; }
  if(key.startsWith('look.')){
    const look = findLook(parts[1]); if(!look) return;
    const field = key.split('.')[1];
    // don't overwrite part objects
    if(['head','upper','lower','accessories'].includes(field)) return;
    look[field] = val; look.updatedAt = Date.now(); persistDebounced(); return;
  }
  if(key.startsWith('lookpart.')){
    const look = findLook(parts[1]); if(!look) return;
    normalizeLook(look);
    const part = parts[2];
    const field = key.split('.')[1]; // text or url
    if(look[part]){ look[part][field]=val; look.updatedAt=Date.now(); persistDebounced(); }
    return;
  }
}

/* Image file -> dataURL for cover/recipe images */
function bindImageFile(inputEl, cb){
  inputEl.addEventListener('change', ()=>{
    const file = inputEl.files[0]; if(!file) return;
    if(file.size > 8*1024*1024){ toast('Image too large — please use one under 8MB.'); return; }
    const reader = new FileReader();
    reader.onload = ()=>{ cb(reader.result); persist(); render(); };
    reader.onerror = ()=>{ toast('Could not read file from computer.'); };
    reader.readAsDataURL(file);
  });
}

        }

    case 'move-day-item': { const tr=findTrip(id); const d=tr&&tr.days.find(x=>x.id===id2); if(d){ moveItem(d.items,id3,t.getAttribute('data-dir')); persist(); render(); } break; }
    case 'remove-trip-cover': { const tr=findTrip(id); if(tr){ tr.cover=''; persist(); render(); } break; }

    /* ---- Mood ---- */
    case 'set-mood': setMoodForDate(id, t.getAttribute('data-val')); render(); break;
    case 'save-today-mood': {
      const today=todayISO();
      let m=db.moods.find(x=>x.date===today);

    case 'delete-today-mood': {
      const today=todayISO();
      db.moods=db.moods.filter(x=>x.date!==today); persist(); toast('Today\'s mood cleared'); render(); break;
    }
    case 'delete-mood': {
      db.moods=db.moods.filter(x=>x.id!==id); persist(); toast('Mood entry deleted'); render(); break;
    }
    case 'mood-filter-emoji': {
      ui.moodFilterEmoji = t.getAttribute('data-val'); render(); break;
    }
    case 'mood-clear-filter': { ui.moodFilterEmoji=null; render(); break; }
    case 'open-journal': {
      const j=db.journals.find(x=>x.date===id) || getJournalForDate(id);
      ui.modal={type:'journalView', date:id, title:j.title||'', content:j.content||''};
      render();
      break;
    }
    case 'journal-edit-from-modal': {
      ui.modal=null; ui.journalViewDate=id; render(); break;
    }
    case 'journal-back-today': { ui.journalViewDate=null; render(); break; }
    case 'journal-search': {
      const inp=document.getElementById('journalSearchInput');
      if(inp) ui.journalQuery=inp.value;
      render(); break;
    }
    case 'review-nav': {
      ui.reviewDrillMonth=null;
      location.hash = `#/review/${id}`;
      break;
    }
    case 'review-drill': {
      ui.reviewDrillMonth = (ui.reviewDrillMonth===id) ? null : id;
      render();
      break;
    }
    case 'review-drill-close': {
      ui.reviewDrillMonth=null; render(); break;
    }
    case 'save-review': {
      // Force-flush all review fields currently on page into DB then persist
      const ym = id || (currentRoute()[1]||todayISO().slice(0,7));
      ensureReview(ym);
      document.querySelectorAll(`[data-bind^="review."][data-bind$="::${ym}"]`).forEach(el=>{
        const spec = el.getAttribute('data-bind');
        const field = spec.split('.')[1].split('::')[0];
        const val = el.tagName==='SELECT' ? el.value : el.value;
        if(field.startsWith('rating') || field==='overall') db.monthlyReviews[ym][field] = parseInt(val,10)||5;
        else db.monthlyReviews[ym][field] = val;
      });
      persist();
      toast('Month review saved ✓');
      render();
      break;
    }
    case 'save-review-fav': {
      const ym = id || (currentRoute()[1]||todayISO().slice(0,7));
      ensureReview(ym);
      const ta = document.querySelector(`[data-bind="review.collection::${ym}"]`);
      if(ta) db.monthlyReviews[ym].collection = ta.value;
      persist();
      toast('Favorite saved to year list ✓');
      render();
      break;
    }
    case 'save-journal': {
      const j=getJournalForDate(id);
      const title=document.querySelector('[data-bind="journal.title::'+id+'"]')?.value || '';
      const content=document.querySelector('[data-bind="journal.content::'+id+'"]')?.value || '';
      saveJournal(id,title,content);
      break;
    }

    /* ---- Search ---- */
    case 'do-search': doSearchSubmit(); break;

    /* ---- Confirm modal ---- */
    case 'modal-confirm-yes': { const cb = ui.modal && ui.modal.onYes; ui.modal=null; if(cb) cb(); else render(); break; }

    /* ---- Quick add ---- */
    case 'quickadd-set-kind': ui.modal.kind = t.getAttribute('data-val'); render(); break;
    case 'quickadd-submit': quickAddSubmit(); break;

    default: break;
  }
});

});

function moveItem(arr,id,dir){
  const i = arr.findIndex(x=>x.id===id);
  if(i<0) return;
  const j = dir==='up'? i-1 : i+1;
  if(j<0 || j>=arr.length) return;
  [arr[i],arr[j]] = [arr[j],arr[i]];
}
function shiftCalMonth(delta){
  const [y,m] = ui.calMonth.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  ui.calMonth = d.toISOString().slice(0,7);
}
function doSearchSubmit(){
  const q = ui.searchQuery || '';
  nav('#/search/'+encodeURIComponent(q));
}
function quickAddSubmit(){
  const form = document.getElementById('quickaddForm');
  const kind = ui.modal.kind;
  const fd = new FormData(form);
  if(kind==='task'){ addTask({title: fd.get('title')||'New Task', dueDate: fd.get('dueDate')||'', priority: fd.get('priority')||'Normal', category: fd.get('category')||''}); toast('Task added'); }
  else if(kind==='goal'){ const g=addLearningGoal(); g.title = fd.get('title')||g.title; persist(); toast('Learning goal added'); }
  else if(kind==='idea'){ const v=addYoutubeIdea(); v.title = fd.get('title')||v.title; persist(); toast('Video idea added'); }
  else if(kind==='recipe'){ const r=addRecipe(); r.title = fd.get('title')||r.title; persist(); toast('Recipe added'); }
  else if(kind==='trip'){ const tr=addTrip(); tr.name = fd.get('title')||tr.name; persist(); toast('Trip added'); }
  else if(kind==='event'){ addEvent({title: fd.get('title')||'New Event', date: fd.get('dueDate')||todayISO()}); toast('Event added'); }
  else if(kind==='note'){ db.quickNote = (db.quickNote? db.quickNote+'\n':'') + (fd.get('title')||''); persist(); toast('Note added'); }
  ui.modal = null;
  render();
}

    <div class="panel-title">Extra Blocks <span class="fine">(optional free-form)</span></div>
    ${r.blocks.map((b,i)=>renderRecipeBlock(r,b,i)).join('')}
    <div class="add-block-bar">
      ${BLOCK_TYPES.map(bt=>`<button class="btn btn-ghost btn-sm" data-action="add-block" data-id="${r.id}" data-btype="${bt.t}">+ ${bt.label}</button>`).join('')}
    </div>
  </div>
  `;
}
function renderRecipeBlock(r,b,i){
  const ctrl = `<div class="block-controls">
      <button class="icon-btn" data-action="move-block" data-id="${r.id}" data-id2="${b.id}" data-dir="up">↑</button>
      <button class="icon-btn" data-action="move-block" data-id="${r.id}" data-id2="${b.id}" data-dir="down">↓</button>
      <button class="icon-btn" data-action="delete-block" data-id="${r.id}" data-id2="${b.id}">✕</button>
    </div>`;
  if(b.type==='divider') return `<div class="block">${ctrl}<hr class="divider"></div>`;
  if(b.type==='heading') return `<div class="block">${ctrl}<h3 contenteditable="true" data-bind="block.content::${r.id}::${b.id}" data-bind-blur="1" style="min-height:1.4em;">${esc(b.content)||'Heading'}</h3></div>`;
  if(b.type==='text' || b.type==='notes' || b.type==='quote') return `<div class="block">${ctrl}
      <div class="small-cap">${b.type==='notes'?'Note':b.type==='quote'?'Quote':'Text'}</div>
      <div contenteditable="true" style="min-height:1.4em; ${b.type==='quote'?'font-style:italic; border-left:3px solid var(--gold); padding-left:10px;':''}" data-bind="block.content::${r.id}::${b.id}" data-bind-blur="1">${esc(b.content)}</div>
    </div>`;
  if(b.type==='image') return `<div class="block">${ctrl}
      ${b.url? `<img src="${b.url}" style="max-width:100%;border-radius:8px;">` : `<input type="file" accept="image/*" class="recipeBlockImgInput" data-rid="${r.id}" data-bid="${b.id}">`}
    </div>`;
  if(['checklist','bullet','numbered','ingredients'].includes(b.type)){
    return `<div class="block">
      ${ctrl}
      <div class="small-cap">${ {checklist:'Checklist',bullet:'Bullet List',numbered:'Numbered List',ingredients:'Ingredients'}[b.type] }</div>
      ${b.items.map((it,idx)=>`
        <div class="item-row">
          ${b.type==='checklist'||b.type==='ingredients'? `<input type="checkbox" class="checkbox" ${it.done?'checked':''} data-action="block-toggle-item" data-id="${r.id}" data-id2="${b.id}" data-id3="${it.id}">` :
            b.type==='numbered'? `<span class="fine" style="width:18px;">${idx+1}.</span>` : `<span class="fine" style="width:18px;">•</span>`}
          <div class="txt ${it.done?'done':''}" contenteditable="true" data-bind="blockitem.text::${r.id}::${b.id}::${it.id}" data-bind-blur="1">${esc(it.text)}</div>
          <div class="row-actions"><button class="icon-btn" data-action="block-delete-item" data-id="${r.id}" data-id2="${b.id}" data-id3="${it.id}">✕</button></div>
        </div>
      `).join('')}
      <button class="btn btn-ghost btn-sm mt8" data-action="block-add-item" data-id="${r.id}" data-id2="${b.id}">+ Add item</button>
    </div>`;
  }
  return '';
}

/* ============================================================
   PAGE: CALENDAR & TASKS
   ============================================================ */
function renderCalendar(route){
  const [y,m] = ui.calMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const startDow = (first.getDay()+6)%7; // Monday=0
  const daysInMonth = new Date(y, m, 0).getDate();
  const monthLabel = first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const today = todayISO();
  const selectedDate = route[1]==='day' ? route[2] : '';

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = new Date(iso+'T00:00:00').getDay();
    const isWeekend = dow===0 || dow===6;
    const dayEvents = db.events.filter(e=>e.date===iso);
    const dayTasks = db.tasks.filter(t=>t.dueDate===iso);
    cells += `<div class="cal-day ${iso===today?'today ':''}${isWeekend?'weekend ':''}${iso===selectedDate?'selected-date':''}" data-action="open-day-modal" data-id="${iso}">
      <div class="num">${d}</div>
      ${dayEvents.slice(0,2).map(e=>`<div class="evt">${esc(e.title)}</div>`).join('')}
      ${dayTasks.length? `<div class="evt" style="background:var(--oxblood);">${dayTasks.length} task${dayTasks.length>1?'s':''}</div>`:''}
      ${dayEvents.length>2? `<div class="fine">+${dayEvents.length-2} more</div>`:''}
    </div>`;
  }

  const allOpenTasks = db.tasks.filter(t=>!t.completed).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
  const doneTasks = db.tasks.filter(t=>t.completed);
  const completionPct = db.tasks.length? Math.round((doneTasks.length/db.tasks.length)*100) : 0;
  const selectedTasks = selectedDate ? db.tasks.filter(t=>t.dueDate===selectedDate) : [];

  return `
  <div class="page-header">
    <div><div class="page-eyebrow">Organize</div><div class="page-title">Calendar &amp; Tasks</div>
    ${selectedDate?`<div class="page-sub">Tasks for ${fmtDate(selectedDate)}</div>`:''}</div>
  </div>
  <div class="grid cols-3">
    <div class="panel" style="grid-column:span 2;">
      <div class="panel-title">
        <div class="cal-nav">
          <button class="icon-btn" data-action="cal-prev-month">←</button>
          <span style="font-family:var(--font-display);font-size:17px;">${monthLabel}</span>
          <button class="icon-btn" data-action="cal-next-month">→</button>
        </div>
        <button class="btn btn-ghost btn-sm" data-action="cal-today">Today</button>
      </div>
      <div class="cal-grid">
        ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>`<div class="cal-dow ${i>=5?'weekend':''}">${d}</div>`).join('')}
        ${cells}
      </div>
      <div class="fine mt12">Click any day to add/view events and jump to that day's To-do list.</div>
    </div>
    <div class="panel">
      <div class="panel-title">Task Completion</div>
      <div class="progress-row"><div class="progress-track" style="flex:1"><div class="progress-fill" style="width:${completionPct}%"></div></div><div class="progress-pct">${completionPct}%</div></div>
      <div class="fine mt8">${doneTasks.length} / ${db.tasks.length} tasks complete</div>
      ${selectedDate?`<div class="fine mt12">${selectedTasks.filter(t=>t.completed).length} / ${selectedTasks.length} complete for ${fmtDateShort(selectedDate)}</div>`:''}
    </div>
  </div>

  <div class="panel mt20" id="todoList">
    <div class="panel-title">
      <div>To-do ${selectedDate?`· <span class="pill pill-gold">${fmtDateShort(selectedDate)}</span>`:''}
        ${selectedDate && selectedTasks.length? `<span class="fine" style="margin-left:8px;">${selectedTasks.filter(t=>t.completed).length}/${selectedTasks.length}</span>`:''}
      </div>
      <button class="btn btn-ghost btn-sm" data-action="add-task-quick" data-date="${selectedDate||''}">+ Add Task</button>
    </div>
    ${selectedDate && selectedTasks.length? `
      <div class="progress-row" style="margin-bottom:12px;">
        <div class="progress-track" style="flex:1"><div class="progress-fill" style="width:${Math.round(selectedTasks.filter(t=>t.completed).length/selectedTasks.length*100)}%"></div></div>
        <div class="progress-pct">${Math.round(selectedTasks.filter(t=>t.completed).length/selectedTasks.length*100)}%</div>
      </div>
    `:''}
    ${selectedDate?`<div class="fine mb12">Events and To-do share the same date. Tasks with a due date appear on their calendar day. Color dots: <span style="color:#c0392b">●</span> Important · <span style="color:#2980b9">●</span> Routine · <span style="color:#d4a017">●</span> Special</div>`:''}
    ${allOpenTasks.length===0 && doneTasks.length===0? `<div class="empty-state" style="padding:24px;"><div class="msg" style="font-size:14px;">No tasks yet</div><button class="btn btn-primary btn-sm" data-action="add-task-quick" data-date="${selectedDate||''}">+ Add Task</button></div>` : `
    ${selectedDate ? (selectedTasks.length ? selectedTasks : []).map(tk=>taskRowHTML(tk)).join('') :
      allOpenTasks.concat(doneTasks).map(tk=>taskRowHTML(tk)).join('')}
    ${selectedDate && selectedTasks.length===0 ? `<div class="empty-state" style="padding:24px;"><div class="msg" style="font-size:14px;">No tasks for this date</div><button class="btn btn-primary btn-sm" data-action="add-task-quick" data-date="${selectedDate}">+ Add Task for this date</button></div>`:''}
    `}
  </div>
  `;
}
function taskRowHTML(tk){
  const tagColor = {important:'#c0392b', routine:'#2980b9', special:'#d4a017', '': 'transparent'}[tk.tag||''] || 'transparent';
  return `<div class="item-row">
    <input type="checkbox" class="checkbox" ${tk.completed?'checked':''} data-action="toggle-task" data-id="${tk.id}">
    <span title="${esc(tk.tag||'no tag')}" style="width:10px;height:10px;border-radius:50%;background:${tagColor};flex-shrink:0;display:inline-block;border:1px solid rgba(0,0,0,.12);"></span>
    <div class="txt ${tk.completed?'done':''}" contenteditable="true" data-bind="task.title::${tk.id}" data-bind-blur="1" style="flex:2;">${esc(tk.title)}</div>
    <select class="field" style="width:120px;" data-bind="task.tag::${tk.id}" title="Color tag">
      <option value="" ${!tk.tag?'selected':''}>Tag…</option>
      <option value="important" ${tk.tag==='important'?'selected':''}>● Important</option>
      <option value="routine" ${tk.tag==='routine'?'selected':''}>● Routine</option>
      <option value="special" ${tk.tag==='special'?'selected':''}>● Special</option>
    </select>
    <select class="field" style="width:100px;" data-bind="task.priority::${tk.id}">
      ${['Low','Normal','High'].map(p=>`<option ${tk.priority===p?'selected':''}>${p}</option>`).join('')}
    </select>
    <input type="date" class="field" style="width:140px;" value="${tk.dueDate||''}" data-bind="task.dueDate::${tk.id}">
    <div class="row-actions"><button class="icon-btn" data-action="delete-task" data-id="${tk.id}">✕</button></div>
  </div>`;
}

/* ============================================================
   PAGE: LOOKBOOK
   ============================================================ */
const LB_SEASONS = [
  {key:'winter', label:'冬季 Winter', desc:'Cold-weather looks'},
  {key:'summer', label:'夏季 Summer', desc:'Hot-weather looks'},
  {key:'thin', label:'薄長袖 Thin long sleeves', desc:'Light long-sleeve outfits'}
];
function ensureLookbooks(){
  if(!Array.isArray(db.lookbooks)) db.lookbooks = [];
}
function findLook(id){ ensureLookbooks(); return db.lookbooks.find(x=>x.id===id); }
function emptyPart(){ return {text:'', photo:'', url:''}; }
function addLookbook(season, name){
  ensureLookbooks();
  const look = {
    id:uid(), season: season||'winter',
    name: (name&&name.trim()) ? name.trim() : ('LookBook ' + (db.lookbooks.filter(x=>x.season===(season||'winter')).length+1)),
    head:emptyPart(), upper:emptyPart(), lower:emptyPart(), accessories:emptyPart(),
    notes:'', url:'', photo:'',
    createdAt:Date.now(), updatedAt:Date.now()
  };
  db.lookbooks.unshift(look); persist(); return look;
}
function normalizeLook(l){
  ['head','upper','lower','accessories'].forEach(p=>{
    if(typeof l[p]==='string') l[p]={text:l[p], photo:'', url:''};
    if(!l[p] || typeof l[p]!=='object') l[p]=emptyPart();
    if(l[p].text==null) l[p].text='';
    if(l[p].photo==null) l[p].photo='';
    if(l[p].url==null) l[p].url='';
  });
  return l;
}
function deleteLookbook(id){
  ensureLookbooks();
  db.lookbooks = db.lookbooks.filter(x=>x.id!==id); persist();
}
function renderLookbook(route){
  ensureLookbooks();
  // #/lookbook/look/:id
  if(route[1]==='look' && route[2]) return renderLookDetail(route[2]);
  // #/lookbook/season/:key
  if(route[1]==='season' && route[2]) return renderLookSeason(route[2]);

  // root: three categories
  const counts = {};
  LB_SEASONS.forEach(s=> counts[s.key] = db.lookbooks.filter(l=>l.season===s.key).length);
  const q = (ui.lookbookQuery||'').trim().toLowerCase();
  const seasonAliases = {
    winter:['winter','冬','冬季'],
    summer:['summer','夏','夏季'],
    thin:['thin','薄','薄長袖','薄长袖','long sleeve','長袖']
  };
  const searchHits = q ? db.lookbooks.filter(l=>{
    normalizeLook(l);
    const seasonLabel = (LB_SEASONS.find(s=>s.key===l.season)||{}).label||l.season;
    const partsText = ['head','upper','lower','accessories'].map(p=> (l[p]&&l[p].text)||'').join(' ');
    const blob = [l.name, partsText, l.notes, l.url, l.season, seasonLabel].join(' ').toLowerCase();
    if(blob.includes(q)) return true;
    // match season keyword → filter that season
    for(const [key, aliases] of Object.entries(seasonAliases)){
      if(aliases.some(a=>q.includes(a)) && l.season===key) return true;
    }
    return false;
  }) : [];

  return `
  <div class="page-header">
    <div><div class="page-eyebrow">Style</div><div class="page-title">LookBook</div>
    <div class="page-sub">Folders by season · each saved look is a file with cover pic. Search by item or 冬/夏/薄長袖.</div></div>
  </div>
  <div class="panel">
    <div class="field-group" style="display:flex;gap:8px;margin:0;">
      <input class="field" id="lookbookSearchInput" type="text" placeholder="搜尋單品、套裝名稱，或 冬季 / 夏季 / 薄長袖…" value="${esc(ui.lookbookQuery)}" data-bind="lookbookQuery">
      <button class="btn btn-ghost btn-sm" data-action="lookbook-search">Search</button>
    </div>
  </div>
  ${q?`
    <div class="panel mt16">
      <div class="panel-title">Search results <span class="fine">${searchHits.length}</span>
        <button class="btn btn-ghost btn-sm" data-action="lookbook-clear-search">Clear</button>
      </div>
      ${searchHits.length===0?`<div class="fine">No matches.</div>`:`
      <div class="grid cols-3 mt12">
        ${searchHits.map(l=>{
          normalizeLook(l);
          const seasonLabel = (LB_SEASONS.find(s=>s.key===l.season)||{}).label||l.season;
          return `<div class="card card-click" onclick="location.hash='#/lookbook/look/${l.id}'" style="padding:0;overflow:hidden;">
            <div style="background:${l.photo?`url('${l.photo}') center/cover`:'linear-gradient(135deg,var(--verdigris),var(--gold))'};height:110px;"></div>
            <div style="padding:10px 12px;">
              <div style="font-family:var(--font-display);font-weight:600;font-size:15px;">${esc(l.name)}</div>
              <div class="fine mt4"><span class="pill pill-gray">${esc(seasonLabel)}</span></div>
            </div>
          </div>`;
        }).join('')}
      </div>`}
    </div>
  `:''}
  <div class="grid cols-3 mt16">
    ${LB_SEASONS.map(s=>`
      <div class="card card-click" onclick="location.hash='#/lookbook/season/${s.key}'">
        <div style="font-family:var(--font-display);font-weight:600;font-size:20px;">${s.label}</div>
        <div class="fine mt8">${s.desc}</div>
        <div class="pill pill-verd mt12">${counts[s.key]} look${counts[s.key]===1?'':'s'}</div>
      </div>
    `).join('')}
  </div>
  `;
}
function renderLookSeason(seasonKey){
  ensureLookbooks();
  const season = LB_SEASONS.find(s=>s.key===seasonKey) || {key:seasonKey, label:seasonKey, desc:''};
  // ALL books saved in this season folder
  const looks = db.lookbooks.filter(l=>l.season===seasonKey).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  return `
  <div class="breadcrumb"><a href="#/lookbook">LookBook</a><span class="sep">/</span><span>${esc(season.label)}</span></div>
  <div class="page-header">
    <div>
      <div class="page-eyebrow">資料夾 · 已儲存 ${looks.length} 本</div>
      <div class="page-title">${esc(season.label)}</div>
      <div class="page-sub">這裡是你存過的每一本 LookBook 封面。點封面打開整套穿搭；按「+ 新增」再存一本。</div>
    </div>
    <button class="btn btn-primary" data-action="add-look" data-id="${seasonKey}">+ 新增一本 LookBook</button>
  </div>
  ${looks.length===0?`
    <div class="empty-state">
      <div class="glyph">◎</div>
      <div class="msg">這個資料夾還沒有任何 LookBook</div>
      <div class="fine" style="margin-bottom:14px;">按下方按鈕新增 → 上傳封面與穿搭 → Save 後會出現在這裡</div>
      <button class="btn btn-primary" data-action="add-look" data-id="${seasonKey}">+ 新增第一本</button>
    </div>
  `:`
    <div class="fine" style="margin-bottom:12px;">共 ${looks.length} 本 · 點封面進入編輯</div>
    <div class="grid cols-3">
      ${looks.map(l=>{
        normalizeLook(l);
        const hasCover = !!(l.photo);
        return `
        <div class="card" style="padding:0;overflow:hidden;">
          <div onclick="location.hash='#/lookbook/look/${l.id}'" style="cursor:pointer;" title="Open this LookBook">
            <div style="height:140px;background:${hasCover?`url('${l.photo}') center/cover`:'linear-gradient(145deg,var(--verdigris),var(--gold))'};display:flex;align-items:center;justify-content:center;">
              ${hasCover?'':`<span style="color:var(--paper);font-family:var(--font-display);font-size:15px;opacity:.9;">尚無封面</span>`}
            </div>
            <div style="padding:12px 14px 4px;">
              <div style="font-family:var(--font-display);font-weight:600;font-size:17px;">${esc(l.name||'未命名 LookBook')}</div>
              <div class="fine mt4">${hasCover?'封面 · 點擊打開':'點擊補上封面與穿搭'}</div>
            </div>
          </div>
          <div style="padding:8px 14px 12px;display:flex;justify-content:space-between;align-items:center;">
            <span class="fine">${fmtDateShort(new Date(l.updatedAt||l.createdAt||Date.now()).toISOString().slice(0,10))}</span>
            <button class="btn btn-danger btn-sm" data-action="delete-look" data-id="${l.id}">刪除</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  `}
  `;
}
function lookPartBlock(l, partKey, partLabel){
  const p = l[partKey] || emptyPart();
  return `<div class="panel">
    <div class="panel-title">${partLabel}</div>
    ${p.photo?`
      <div style="border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--parchment);margin-bottom:8px;">
        <img src="${p.photo}" style="width:100%;height:100%;object-fit:cover;display:block;">
      </div>
      <button class="btn btn-ghost btn-sm" data-action="look-part-clear-photo" data-id="${l.id}" data-id2="${partKey}">Remove photo</button>
    `:''}
    <div class="field-group mt8">
      <label class="flabel">Upload from computer</label>
      <input type="file" accept="image/*" class="lookPartImgInput field" data-lid="${l.id}" data-part="${partKey}">
    </div>
    <div class="field-group mt8"><label class="flabel">Notes</label>
      <textarea class="field" rows="2" data-bind="lookpart.text::${l.id}::${partKey}" placeholder="Description…">${esc(p.text)}</textarea>
    </div>
    <div class="field-group"><label class="flabel">URL</label>
      <input class="field" value="${esc(p.url)}" data-bind="lookpart.url::${l.id}::${partKey}" placeholder="https://…">
    </div>
  </div>`;
}
function renderLookDetail(id){
  let l = findLook(id);
