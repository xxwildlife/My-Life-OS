<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Life OS · Yolanda</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#f5eddd;--paper2:#fffaf0;--ink:#3d3027;--muted:#786a5c;
 --wine:#8d4f43;--green:#66775e;--gold:#b38b57;--line:#d8c8ae;
 --shadow:0 8px 25px rgba(69,48,31,.11)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#e8dcc6;color:var(--ink)}
body{font-family:"Noto Serif TC",serif;line-height:1.5}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

/* 頂層結構：主框架使用 flex 佈局確保左右並排不重疊 */
.app {
  min-height: 100vh;
  display: flex;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,255,255,.55),transparent 28%),
    radial-gradient(circle at 85% 80%,rgba(139,82,65,.08),transparent 24%),
    repeating-linear-gradient(0deg,rgba(92,65,43,.025) 0 1px,transparent 1px 4px);
}

/* 側邊導覽列修正 */
.sidebar {
  width: 250px;
  min-width: 250px;
  height: 100vh;
  position: sticky;
  top: 0;
  padding: 28px 18px;
  background: rgba(247,239,224,.96);
  border-right: 1px solid #d7c8b1;
  z-index: 10;
  overflow-y: auto;
}
.brand{font:600 30px/1 "Cormorant Garamond",serif;margin:0 10px}
.brand small{font:14px "Patrick Hand";display:block;margin-top:8px;color:var(--wine)}
.nav{margin-top:28px;display:grid;gap:5px}

/* 選單按鈕防止換行與重疊 */
.nav button {
  border: 0;
  background: transparent;
  text-align: left;
  color: var(--ink);
  padding: 10px 12px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14px;
  width: 100%;
  white-space: nowrap;
}
.nav button:hover,.nav button.active{background:#ead7ca}
.ico{width:22px;text-align:center;font-size:17px;flex-shrink:0;}
.quote{margin:28px 2px 0;padding:18px 14px;background:#f0e2cd;border:1px solid #dcc8a9;transform:rotate(-1deg);
font:18px/1.3 "Cormorant Garamond",serif}
.quote span{display:block;font:13px "Patrick Hand";margin-top:8px;text-align:right}

/* 右側主內容容器 */
.main {
  flex-grow: 1;
  width: 0;
  padding: 25px;
  min-width: 0;
}
.top,.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}
.greeting{font:31px "Cormorant Garamond",serif}
.sub{font-size:13px;color:var(--muted)}
.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff9ef;color:var(--ink);border-radius:10px;padding:9px 13px;
box-shadow:0 2px 8px rgba(60,40,20,.05)}
.btn.primary{background:var(--wine);color:#fffaf1;border-color:var(--wine)}

/* 橫幅區域 */
.hero{min-height:100px;padding:24px 28px;position:relative;overflow:hidden;border:1px solid #d5c2a5;border-radius:18px;
background:linear-gradient(90deg,rgba(255,248,233,.97) 0 56%,rgba(241,224,197,.84)),linear-gradient(145deg,#e5d0ae,#f9f0df);
box-shadow:var(--shadow)}
.hero:after{content:"❦";position:absolute;right:27px;bottom:7px;color:#9a6a55;font-size:48px;transform:rotate(-12deg)}
.hero h1{font:600 40px/1.05 "Cormorant Garamond",serif;margin:5px 0 3px;max-width:650px}
.hero-image{width:100%;height:300px;object-fit:cover;display:block;border-radius:12px;}
.hero p{font:17px "Cormorant Garamond",serif;margin:0;color:#5d4b3d}
.datecard{position:absolute;right:55px;top:25px;background:#fff9ed;border:1px solid #d5c3a9;padding:12px 25px;
text-align:center;transform:rotate(1.5deg);box-shadow:var(--shadow)}
.datecard strong{font:28px "Cormorant Garamond";display:block}.datecard small{color:var(--muted)}

/* 格線與元件配置 */
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}
.stat,.panel,.card{background:rgba(255,250,240,.95);border:1px solid #d9c8ac;border-radius:14px;box-shadow:var(--shadow)}
.stat{padding:13px 15px;min-height:90px}.stat .label{font-size:12px;color:var(--muted)}
.stat .num{font:31px "Cormorant Garamond";margin:3px 0}
.progress{height:5px;background:#e5d7c2;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;background:var(--wine);border-radius:5px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{padding:20px;}
.panel h2{font:600 21px/1.2 "Cormorant Garamond";margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel h2 small{font:12px "Noto Serif TC";color:var(--muted);font-weight:400}
.list{display:grid;gap:7px}.row{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px dashed #ddcfb9;min-width:0}
.row:last-child{border:0}.row b{font-weight:600;word-break:normal;overflow-wrap:normal}.row>div{min-width:0}
.thumb{width:58px;height:43px;flex:0 0 58px;border-radius:7px;object-fit:cover;background:#e3d1b5;display:grid;place-items:center;font-size:20px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}.meta{font-size:11px;color:var(--muted);margin-top:2px}
.tag{margin-left:auto;font-size:10px;padding:4px 7px;border-radius:9px;background:#eadfd0;white-space:nowrap}
.add{width:100%;margin-top:10px;border:1px dashed #c8b79b;background:#faf2e3;padding:8px;border-radius:9px;color:#6e5b49}

.calendar{grid-column:span 2}
.weekly-home{margin-bottom:20px}
.schedule{display:grid;grid-template-columns:42px 1fr;gap:7px;font-size:12px}
.time{color:#8c7a67}.event{padding:7px 10px;border-radius:8px;background:#ead4ca;border-left:4px solid var(--wine)}
.event.green{background:#dfe8d7;border-left-color:var(--green)}
.event.gold{background:#efe0bd;border-left-color:var(--gold)}

/* 修正首頁底部 4 欄區塊防爆格線配置 */
.bottom-widgets {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-top: 20px;
  align-items: start;
}
.panel.mini {
  padding: 16px;
  min-height: 180px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:10px}.week div{padding:6px 2px;border:1px solid #e0d1bb;text-align:center;min-height:33px}
.week .head{background:#eee2cf;font-weight:600;min-height:auto}
.page{display:none}
.page.active{display:block}
.section-head h1{font:600 39px/1 "Cormorant Garamond";margin:0}.section-head p{color:var(--muted);margin:5px 0 0;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{padding:16px;min-width:0}
.card h3{font:600 23px/1.15 "Cormorant Garamond";margin:0 0 8px}.card p{font-size:13px;line-height:1.65}
.bar{height:7px;background:#e7dac6;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--wine)}
.check{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.check input{accent-color:var(--wine);cursor:pointer}

/* 畫布與拖曳便利貼配置 */
.board{position:relative;min-height:500px;border:1px dashed #c8b79c;border-radius:16px;background:#f3e7d3;overflow:auto}
.sticky {
  position: absolute;
  width: 190px;
  padding: 14px;
  background: #fff1bf;
  box-shadow: 0 8px 15px rgba(50,35,20,.15);
  cursor: grab;
  white-space: pre-wrap;
  border-radius: 4px;
  z-index: 5;
}
.sticky:nth-child(2){background:#e7e8d3}.sticky:nth-child(3){background:#efd9d1}

/* 遮罩與提示層 */
.modal-back{position:fixed;inset:0;background:rgba(38,27,19,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-back.show{display:flex}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff9ef;border:1px solid #cdbb9e;
border-radius:17px;padding:22px;box-shadow:0 25px 80px rgba(20,12,8,.3)}
.modal h2{font:600 30px "Cormorant Garamond";margin:0 0 15px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #d7c7ad;background:#fffdf8;border-radius:9px;outline:none;color:var(--ink)}
.field textarea { min-height: 100px; resize: vertical; }
.empty{text-align:center;padding:30px;color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;background:#3d3027;color:#fffaf1;padding:12px 16px;border-radius:10px;
opacity:0;transform:translateY(10px);transition:.25s;z-index:100}.toast.show{opacity:1;transform:translateY(0)}
.cover{width:100%;height:150px;object-fit:cover;border-radius:10px;background:#e3d1b5;display:block;margin-bottom:12px}
.recipe-emoji{height:150px;font-size:60px;display:grid;place-items:center;background:#eadbc3;border-radius:10px;margin-bottom:12px}

/* RWD 響應式優化斷點 */
@media(max-width:1200px){.grid5{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.calendar{grid-column:auto}.bottom-widgets{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){
 .sidebar{position:relative;width:100%;height:auto;border-right:0;border-bottom:1px solid #d7c8b1;padding:18px 12px}
 .app{display:block}.main{margin-left:0;width:100%;padding:15px}
 .nav{grid-template-columns:repeat(2,1fr);margin-top:18px}.quote{display:none}
 .top,.section-head{align-items:flex-start;flex-direction:column}.toolbar{width:100%}.toolbar .btn{flex:1}
 .hero{min-height:260px;padding:20px}.hero h1{font-size:36px;max-width:100%}
 .datecard{position:relative;right:auto;top:auto;display:inline-block;margin-top:24px}
 .grid5,.grid,.bottom-widgets,.cards{grid-template-columns:1fr}
 .formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}
 .section-head h1{font-size:34px}.board{min-height:600px;overflow:auto}
}
</style>
</head>
<body>
<div class="app">
 <aside class="sidebar">
  <div class="brand">My Life OS<small>✿ by Yolanda</small></div>
  <nav class="nav">
   <button class="active" data-page="home"><span class="ico">⌂</span>Home</button>
