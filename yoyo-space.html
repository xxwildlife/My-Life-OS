<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尤尤 Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  /* Matcha #73BF00 × Renaissance parchment × cute */
  --parchment:#EEF5E8;
  --parchment-deep:#D8EBC8;
  --parchment-shadow:#B8D99A;
  --ink:#1A2E12;
  --ink-soft:#4A6B3A;
  --gold:#8B7355;
  --gold-bright:#A68B6A;
  --verdigris:#5A9A3C;
  --verdigris-deep:#3D7A28;
  --matcha:#73BF00;
  --matcha-bright:#8FD42A;
  --matcha-soft:rgba(115,191,0,0.16);
  --oxblood:#7A2E2E;
  --oxblood-bright:#9A3B3B;
  --paper:#F7FBF2;
  --line:rgba(26,46,18,0.12);
  --shadow:0 8px 24px rgba(26,46,18,0.10);
  --shadow-lg:0 16px 40px rgba(26,46,18,0.16);
  --radius:12px;
  --font-display:'Playfair Display', 'Cinzel', 'Cormorant Garamond', serif;
  --font-display-en:'Cinzel', 'Playfair Display', serif;
  --font-body:'EB Garamond', 'Cormorant Garamond', serif;
  --font-ui:'Inter', sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1100px 560px at 8% -8%, rgba(115,191,0,0.18), transparent 58%),
    radial-gradient(900px 500px at 100% 0%, rgba(139,115,85,0.10), transparent 50%),
    radial-gradient(700px 400px at 50% 100%, rgba(61,122,40,0.07), transparent 55%),
    var(--parchment);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--matcha); color:var(--paper); }
a{ color:inherit; }
button{ font-family:var(--font-ui); cursor:pointer; }
input,textarea,select{ font-family:var(--font-body); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--parchment-shadow); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }


/* ========== Renaissance & still-life art layer ========== */
:root{
  /* Dining / still life series — stable Wikimedia thumbs */
  --art-table1: url("https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Clara_Peeters_-_Still_Life_with_Cheeses%2C_Almonds_and_Pretzels_-_Google_Art_Project.jpg/800px-Clara_Peeters_-_Still_Life_with_Cheeses%2C_Almonds_and_Pretzels_-_Google_Art_Project.jpg");
  --art-table2: url("https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Osias_Beert_%28I%29_-_Dishes_with_Oysters%2C_Fruit%2C_and_Wine_-_Google_Art_Project.jpg/800px-Osias_Beert_%28I%29_-_Dishes_with_Oysters%2C_Fruit%2C_and_Wine_-_Google_Art_Project.jpg");
  --art-table3: url("https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/StillLifeWithGlassOfChampagneAndPie.jpg/800px-StillLifeWithGlassOfChampagneAndPie.jpg");
  --art-venus: url("https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg/800px-Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg");
  --art-athens: url("https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/The_School_of_Athens.jpg/800px-The_School_of_Athens.jpg");
  --art-spring: url("https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Botticelli-primavera.jpg/800px-Botticelli-primavera.jpg");
  --art-lady: url("https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Lady_with_an_Ermine_-_Leonardo_da_Vinci_-_Google_Art_Project.jpg/600px-Lady_with_an_Ermine_-_Leonardo_da_Vinci_-_Google_Art_Project.jpg");
  --art-david: url("https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Michelangelo%27s_David_2015.jpg/400px-Michelangelo%27s_David_2015.jpg");
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  opacity:0.04;
  background-image: var(--art-table1);
  background-size: cover;
  background-position: center;
  mix-blend-mode: multiply;
}
#app{ position:relative; z-index:1; }

.art-hero{
  position:relative; overflow:hidden;
  border-radius:18px; margin-bottom:20px;
  height: clamp(150px, 22vw, 220px);
  box-shadow: var(--shadow-lg);
  border:1px solid rgba(139,115,85,0.25);
}
.art-hero .art-bg{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit: cover; object-position: center 35%;
  display:block;
  filter:saturate(0.95) contrast(1.04);
}
.art-hero .art-veil{
  position:absolute; inset:0;
  background: linear-gradient(100deg, rgba(26,46,18,0.78) 0%, rgba(26,46,18,0.4) 50%, rgba(26,46,18,0.12) 100%);
}
.art-hero .art-content{
  position:relative; z-index:2;
  height:100%;
  padding:22px 26px;
  color: #F7FBF2;
  display:flex; flex-direction:column; justify-content:flex-end;
  max-width: 720px;
}
.art-hero .art-kicker{
  font-family:var(--font-display-en); font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
  opacity:0.88; margin-bottom:6px;
}
.art-hero .art-title{
  font-family:var(--font-display-en); font-weight:600; font-size:clamp(22px, 3vw, 32px); line-height:1.2;
  text-shadow: 0 2px 14px rgba(0,0,0,0.4);
  letter-spacing:0.02em;
}
.art-hero .art-sub{
  font-family:var(--font-body); font-size:15px; opacity:0.92; margin-top:6px;
  font-style:italic;
}
.art-hero .art-content.row{
  flex-direction:row; align-items:flex-end; justify-content:space-between;
  max-width:none; width:100%; gap:16px; flex-wrap:wrap;
}

.art-strip{
  display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px;
}
@media(max-width:720px){ .art-strip{ grid-template-columns:1fr; } }
.art-tile{
  position:relative; overflow:hidden; border-radius:14px;
  height: 110px;
  border:1px solid rgba(139,115,85,0.22); box-shadow:var(--shadow);
}
.art-tile img{
  width:100%; height:100%; object-fit:cover; object-position:center;
  display:block; transition: transform .45s ease;
  filter:saturate(0.92);
}
.art-tile:hover img{ transform:scale(1.05); }

.panel, .card{
  position:relative;
  background: linear-gradient(180deg, rgba(247,251,242,0.98), rgba(247,251,242,0.94));
}
.panel::after, .card::after{
  content:"";
  position:absolute; inset:0; pointer-events:none; border-radius:inherit;
  box-shadow: inset 0 0 0 1px rgba(139,115,85,0.1);
}
.page-ornament{
  display:flex; align-items:center; gap:12px; margin:4px 0 10px;
}
.page-ornament .line{
  flex:1; height:1px;
  background: linear-gradient(90deg, transparent, rgba(139,115,85,0.45), transparent);
}
.page-ornament .gem{
  width:7px; height:7px; border-radius:50%;
  background: var(--gold); box-shadow:0 0 0 3px rgba(139,115,85,0.14);
}

.sidebar .brand{
  position:relative; overflow:hidden;
  padding-bottom:22px !important;
}
.sidebar .brand::before{
  content:"";
  position:absolute; right:-30px; top:-30px; width:140px; height:140px;
  background: var(--art-table2) center/cover;
  opacity:0.28; border-radius:50%;
  filter:saturate(0.85);
}
.sidebar .brand .title{
  font-family: var(--font-display-en) !important;
  letter-spacing:0.04em;
}
.sidebar .brand .mark{
  font-family: var(--font-display-en) !important;
}
.sidebar .nav-art{
  margin: 10px 14px 6px;
  height: 72px; border-radius:10px; overflow:hidden;
  border:1px solid rgba(237,227,204,0.12);
  opacity:0.85;
}
.sidebar .nav-art img{ width:100%; height:100%; object-fit:cover; display:block; }
.sidebar .foot{
  position:relative;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,0.25));
  font-family: var(--font-display-en) !important;
  letter-spacing:0.06em;
  font-size:10px !important;
}
.sidebar .foot-quote{
  padding: 8px 22px 0;
  font-family: var(--font-body);
  font-style: italic;
  font-size: 12px;
  color: rgba(237,227,204,0.45);
  line-height:1.35;
}

.empty-state{ position:relative; overflow:hidden; }
.empty-state::before{
  content:""; position:absolute; inset:0;
  background: var(--art-table1) center/cover;
  opacity:0.08; pointer-events:none;
}

.modal{
  background: linear-gradient(180deg, rgba(247,251,242,0.99), #F7FBF2);
  border:1px solid rgba(139,115,85,0.22);
}
.modal::before{
  content:"";
  display:block; height:4px; margin:-24px -24px 16px;
  background: linear-gradient(90deg, var(--gold), var(--matcha), var(--gold));
  border-radius:14px 14px 0 0;
}

.btn{ display:inline-flex; align-items:center; gap:6px; }
.btn-primary{ box-shadow: 0 4px 14px rgba(115,191,0,0.28); }
.card-click:hover{ border-color: rgba(139,115,85,0.35); }

.art-float-statue{
  position:fixed; right:16px; bottom:72px; width:64px; height:96px;
  border-radius:10px; overflow:hidden;
  opacity:0.22; pointer-events:none; z-index:5;
  box-shadow: var(--shadow); display:none;
  border:1px solid rgba(139,115,85,0.2);
}
.art-float-statue img{ width:100%; height:100%; object-fit:cover; object-position:center top; }
@media(min-width:1100px){ .art-float-statue{ display:block; } }

.page-title{
  font-family: var(--font-display-en) !important;
  letter-spacing:0.02em;
}

/* ---------- Layout ---------- */
#app{ display:flex; min-height:100vh; }

.sidebar{
  width:236px; flex-shrink:0;
  background:linear-gradient(180deg, #1a2a18 0%, #243528 55%, #1e2a1c 100%);
  color:var(--parchment);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  z-index:40;
}
.sidebar .brand{
  padding:26px 22px 18px;
  border-bottom:1px solid rgba(237,227,204,0.14);
}
.sidebar .brand .mark{
  font-family:var(--font-display); font-size:15px; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--matcha-bright); margin-bottom:4px;
}
.sidebar .brand .title{
  font-family:var(--font-display); font-weight:600; font-size:22px; line-height:1.15;
}
.sidebar nav{ padding:14px 12px; flex:1; }
.nav-group-label{
  font-family:var(--font-ui); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
  color:rgba(237,227,204,0.45); padding:16px 12px 6px;
}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 12px; border-radius:8px; margin:2px 4px;
  font-family:var(--font-ui); font-size:14px; font-weight:500;
  color:rgba(237,227,204,0.82); text-decoration:none;
  transition:background 0.15s ease, color 0.15s ease;
  border:none; background:transparent; width:calc(100% - 8px); text-align:left;
}
.nav-item .ic{ width:18px; text-align:center; opacity:0.85; font-size:14px; }
.nav-item:hover{ background:rgba(237,227,204,0.08); color:var(--parchment); }
.nav-item.active{ background:rgba(115,191,0,0.20); color:var(--matcha-bright); }
.nav-item .ic{ font-size:15px; }
.sidebar .foot{ padding:14px 22px 20px; font-size:11px; color:rgba(237,227,204,0.35); font-family:var(--font-ui); border-top:1px solid rgba(237,227,204,0.1); }

.main{ flex:1; min-width:0; display:flex; flex-direction:column; }

.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:14px;
  padding:14px 28px; background:rgba(237,227,204,0.86); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar .menu-btn{ display:none; background:none; border:none; font-size:20px; color:var(--ink); padding:4px; }
.search-box{
  flex:1; max-width:420px; display:flex; align-items:center; gap:8px;
  background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:8px 14px;
}
.search-box input{ border:none; background:none; outline:none; flex:1; font-size:14px; color:var(--ink); }
.search-box .ic{ opacity:0.55; }
.topbar-spacer{ flex:1; }
.save-status{
  font-family:var(--font-ui); font-size:12px; color:var(--verdigris-deep);
  display:flex; align-items:center; gap:6px; opacity:0; transition:opacity 0.3s ease;
}
.save-status.show{ opacity:1; }
.save-status .dot{ width:6px; height:6px; border-radius:50%; background:var(--verdigris); }
.btn-quickadd{
  font-family:var(--font-ui); font-weight:600; font-size:13px;
  background:var(--oxblood); color:var(--paper); border:none; border-radius:20px;
  padding:9px 16px; display:flex; align-items:center; gap:6px; box-shadow:var(--shadow);
  transition:transform 0.12s ease, background 0.15s ease;
}
.btn-quickadd:hover{ background:var(--oxblood-bright); transform:translateY(-1px); }

.content{ padding:28px 32px 80px; max-width:1280px; width:100%; margin:0 auto; }

.page-header{ margin-bottom:22px; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.page-eyebrow{ font-family:var(--font-ui); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--matcha); margin-bottom:6px; }
.page-title{ font-family:var(--font-display); font-weight:600; font-size:34px; color:var(--ink); }
.page-sub{ font-family:var(--font-body); font-size:15px; color:var(--ink-soft); margin-top:4px; }

.breadcrumb{ font-family:var(--font-ui); font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.breadcrumb a{ color:var(--verdigris-deep); text-decoration:none; }
.breadcrumb a:hover{ text-decoration:underline; }
.breadcrumb .sep{ opacity:0.4; }

/* ---------- Cards / grid ---------- */
.grid{ display:grid; gap:18px; }
.grid.cols-4{ grid-template-columns:repeat(4,1fr); }
.grid.cols-3{ grid-template-columns:repeat(3,1fr); }
.grid.cols-2{ grid-template-columns:repeat(2,1fr); }
@media(max-width:1100px){ .grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);} }
@media(max-width:680px){ .grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;} }

.card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.card::before{
  content:""; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,var(--matcha),var(--gold-bright));
  opacity:0.85;
}
.card-click{ cursor:pointer; transition:transform 0.15s ease, box-shadow 0.15s ease; }
.card-click:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); }

.panel{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
.panel-title{ font-family:var(--font-display); font-weight:600; font-size:18px; margin:0 0 12px; display:flex; align-items:center; justify-content:space-between; gap:8px; }

.small-cap{ font-family:var(--font-ui); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft); }

/* ---------- Buttons ---------- */
.btn{
  font-family:var(--font-ui); font-weight:600; font-size:13px; border-radius:8px; border:1px solid transparent;
  padding:8px 14px; display:inline-flex; align-items:center; gap:6px; transition:all 0.15s ease; background:none;
}
.btn-primary{ background:var(--matcha); color:var(--paper); }
.btn-primary:hover{ background:var(--verdigris-deep); }
.btn-ghost{ background:transparent; color:var(--ink-soft); border-color:var(--line); }
.btn-ghost:hover{ background:rgba(42,33,21,0.05); color:var(--ink); }
.btn-danger{ background:transparent; color:var(--oxblood); border-color:rgba(122,46,46,0.3); }
.btn-danger:hover{ background:rgba(122,46,46,0.08); }
.btn-sm{ padding:5px 10px; font-size:12px; }
.icon-btn{ background:none; border:none; color:var(--ink-soft); padding:5px 7px; border-radius:6px; font-size:14px; }
.icon-btn:hover{ background:rgba(42,33,21,0.07); color:var(--ink); }

/* ---------- Progress ---------- */
.progress-track{ height:8px; background:var(--parchment-shadow); border-radius:6px; overflow:hidden; }
.progress-fill{ height:100%; background:linear-gradient(90deg,var(--matcha),var(--gold-bright)); border-radius:6px; transition:width 0.4s ease; }
.progress-row{ display:flex; align-items:center; gap:10px; }
.progress-pct{ font-family:var(--font-ui); font-weight:700; font-size:13px; color:var(--verdigris-deep); min-width:38px; text-align:right; }

/* ---------- Inline editable ---------- */
[contenteditable]{ outline:none; }
[contenteditable]:hover{ background:rgba(166,121,31,0.06); border-radius:4px; }
[contenteditable]:focus{ background:rgba(166,121,31,0.1); border-radius:4px; box-shadow:0 0 0 2px rgba(166,121,31,0.25); }
.editable-hint{ font-size:11px; color:var(--ink-soft); opacity:0; transition:opacity 0.15s; }
.editable-wrap:hover .editable-hint{ opacity:0.6; }

input.field, textarea.field, select.field{
  width:100%; border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:14px;
  background:var(--parchment); color:var(--ink); transition:border 0.15s ease, background 0.15s ease;
}
input.field:focus, textarea.field:focus, select.field:focus{ outline:none; border-color:var(--gold); background:var(--paper); }
label.flabel{ font-family:var(--font-ui); font-size:11.5px; letter-spacing:0.04em; color:var(--ink-soft); display:block; margin-bottom:5px; }
.field-group{ margin-bottom:14px; }

.checkbox{ width:18px; height:18px; accent-color:var(--verdigris); cursor:pointer; flex-shrink:0; }

.empty-state{
  text-align:center; padding:48px 20px; color:var(--ink-soft);
  border:1.5px dashed var(--parchment-shadow); border-radius:var(--radius); background:rgba(246,240,222,0.4);
}
.empty-state .glyph{ font-size:30px; margin-bottom:10px; opacity:0.6; }
.empty-state .msg{ font-family:var(--font-display); font-size:17px; color:var(--ink); margin-bottom:14px; }

.pill{ font-family:var(--font-ui); font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; display:inline-block; }
.pill-gold{ background:rgba(166,121,31,0.15); color:var(--gold); }
.pill-verd{ background:rgba(76,107,92,0.15); color:var(--verdigris-deep); }
.pill-ox{ background:rgba(122,46,46,0.13); color:var(--oxblood); }
.pill-gray{ background:rgba(42,33,21,0.08); color:var(--ink-soft); }

/* ---------- Modal / Drawer ---------- */
.overlay{ position:fixed; inset:0; background:rgba(24,18,10,0.45); backdrop-filter:blur(2px); z-index:100; display:flex; align-items:center; justify-content:center; animation:fadeIn 0.15s ease; }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.modal{ background:var(--paper); border-radius:14px; box-shadow:var(--shadow-lg); width:min(480px,92vw); padding:24px; animation:popIn 0.18s ease; max-height:88vh; overflow-y:auto; }
@keyframes popIn{ from{opacity:0; transform:translateY(8px) scale(0.98);} to{opacity:1; transform:none;} }
.modal.modal-lg{ width:min(680px,94vw); }
.modal h3{ font-family:var(--font-display); font-size:20px; margin:0 0 14px; }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }

.drawer-overlay{ position:fixed; inset:0; background:rgba(24,18,10,0.35); z-index:90; animation:fadeIn 0.15s ease; }
.drawer{
  position:fixed; top:0; right:0; height:100vh; width:min(560px,92vw); background:var(--paper);
  box-shadow:-12px 0 40px rgba(24,18,10,0.25); z-index:95; overflow-y:auto;
  animation:slideIn 0.22s cubic-bezier(.16,1,.3,1);
}
@keyframes slideIn{ from{transform:translateX(100%);} to{transform:translateX(0);} }
.drawer-head{ position:sticky; top:0; background:var(--paper); border-bottom:1px solid var(--line); padding:18px 22px; display:flex; align-items:center; justify-content:space-between; z-index:2; }
.drawer-body{ padding:20px 22px 60px; }

.toast{ position:fixed; bottom:22px; right:22px; background:var(--ink); color:var(--parchment); font-family:var(--font-ui); font-size:13px; padding:11px 18px; border-radius:8px; box-shadow:var(--shadow-lg); z-index:200; animation:toastIn 0.2s ease; }
@keyframes toastIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

/* ---------- Curriculum / list rows ---------- */
.item-row{ display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line); }
.item-row:last-child{ border-bottom:none; }
.item-row .txt{ flex:1; font-size:14.5px; }

<body>
<div id="app"></div>
<script>
/* ============================================================
   PERSONAL LIFE OS — data layer, router, renderer
   ============================================================ */

/* ---------------- Utilities ---------------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Local calendar date helpers — avoid toISOString() (UTC) which shifts dates in Taiwan (UTC+8) */
function pad2(n){ return String(n).padStart(2,'0'); }
function toLocalISODate(d){
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function todayISO(){ return toLocalISODate(new Date()); }
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso+'T12:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateShort(iso){ if(!iso) return ''; const d=new Date(iso+'T12:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function debounce(fn,ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a),ms); }; }

/* ---------------- Persistent data layer ---------------- */
const DB_KEY='lifeos_db_v1';
function defaultDB(){
  return {
    learningGoals: [],
    studyLogs: [],
    youtubeIdeas: [],
    recipes: [],
    tasks: [],
    events: [],
    weeklyPlans: {},      // weekStartISO -> { Mon:[...], Tue:[...], ... }
    wishlist: [],
    watchlist: [],  // {id,title,channel,category,synopsis,status,url,createdAt,updatedAt}
    watchCategories: ['電影 Movie','影集 Series','動畫 Anime','紀錄片 Doc','綜藝 Variety','其他 Other'],
    trips: [],
    spotBooks: [], // {id,name,place,notes,items:[{id,title,note,url}],createdAt,updatedAt}

    monthlyReviews: {},   // 'YYYY-MM' -> {...}
    moods: [],            // {id,date,mood,note,tags}
    journals: [],         // {id,date,title,content,updatedAt}
    galleryAlbums: [],    // {id,name,createdAt,updatedAt,photos:[{id,name,date,note,blobKey}]}
    lookbooks: [], // {id,season:'winter'|'summer'|'thin', name, head, upper, lower, accessories, notes, url, photo, createdAt, updatedAt}
    lookbook: {}, // legacy (ignored)
    quickNote: '',
    pinnedNav: [], // array of seg strings, order = pin order, unlimited
    navOrder: [],  // full sidebar order of segs; empty = default NAV_ITEMS order
    ytTypes: ['Vlog','Travel','Tutorial','Lifestyle','Story','Review','Other'],
    eveningPlans: {}  // 'YYYY-MM-DD' -> { '1730-1900': html, '1900-2100': html, '2100-2230': html }
  };
}
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultDB(), parsed);
  }catch(e){ console.error('DB load failed', e); return defaultDB(); }
}
let db = loadDB();
let saveTimer=null;
function persist(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    flashSaved();
  }catch(e){
    console.error('DB save failed', e);
    toast('Could not save — storage may be full.');
  }
}
const persistDebounced = debounce(persist, 450);
function flashSaved(){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.textContent = 'Saved ✓';
  el.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>el.classList.remove('show'), 1400);
}
function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}

/* ---------------- Gallery storage (IndexedDB) ---------------- */
let galleryDbPromise = null;
function openGalleryDB(){
  if(!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB unavailable'));
  if(galleryDbPromise) return galleryDbPromise;
  galleryDbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open('lifeos_gallery_v1',1);
    req.onupgradeneeded = () => {
      const idb = req.result;
      if(!idb.objectStoreNames.contains('images')) idb.createObjectStore('images');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return galleryDbPromise;
}
function idbPutImage(key, blob){
  return openGalleryDB().then(idb=>new Promise((resolve,reject)=>{
    const tx=idb.transaction('images','readwrite'); tx.objectStore('images').put(blob,key);
    tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
  }));
}
function idbGetImage(key){
  return openGalleryDB().then(idb=>new Promise((resolve,reject)=>{
    const tx=idb.transaction('images','readonly'); const req=tx.objectStore('images').get(key);
    req.onsuccess=()=>resolve(req.result||null); req.onerror=()=>reject(req.error);
  }));
}
function idbDeleteImage(key){
  return openGalleryDB().then(idb=>new Promise((resolve,reject)=>{
    const tx=idb.transaction('images','readwrite'); tx.objectStore('images').delete(key);
    tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
  }));
}
function findGalleryAlbum(id){ return db.galleryAlbums.find(a=>a.id===id); }
function findGalleryPhoto(albumId,photoId){
  const a=findGalleryAlbum(albumId);
  return a ? a.photos.find(p=>p.id===photoId) : null;

function getWeekStart(iso){
  const d = new Date(iso+'T12:00:00'); // noon avoids DST / timezone edge
  const day = d.getDay(); // 0 Sun .. 6 Sat
  const diff = (day===0? -6 : 1-day); // move to Monday
  d.setDate(d.getDate()+diff);
  return toLocalISODate(d);
}
function addDays(iso,n){
  const d = new Date(iso+'T12:00:00');
  d.setDate(d.getDate()+n);
  return toLocalISODate(d);
}

function addTrip(){
  const t={
    id:uid(), name:'New Trip', destination:'', startDate:'', endDate:'', cover:'', overview:'',
    days:[{id:uid(),label:'Day 1',items:[]}],
    timeline:[{ id:uid(), type:'day', label:'Day 1' }]
  };
  db.trips.unshift(t); persist(); return t;

/** Flat timeline: day dividers + stops — human-friendly ordering */
function ensureTripTimeline(t){
  if(!t) return [];
  if(!Array.isArray(t.timeline) || t.timeline.length===0){
    // migrate from classic days[]
    const tl = [];
    if(Array.isArray(t.days) && t.days.length){
      t.days.forEach((d,i)=>{
        tl.push({ id: d.id||uid(), type:'day', label: d.label||('Day '+(i+1)) });
        (d.items||[]).forEach(it=>{
          tl.push({
            id: it.id||uid(), type:'stop',
            time: it.time||'', location: it.location||'', activity: it.activity||'',
            notes: it.notes||'', cost: it.cost||'', link: it.link||'',
            spotItemId: it.spotItemId||''
          });
        });
      });
    }
    if(!tl.length) tl.push({ id:uid(), type:'day', label:'Day 1' });
    t.timeline = tl;
  }
  return t.timeline;
}
function addTimelineDay(tripId, label){
  const t = findTrip(tripId); if(!t) return;
  const tl = ensureTripTimeline(t);
  const n = tl.filter(x=>x.type==='day').length + 1;
  tl.push({ id:uid(), type:'day', label: label||('Day '+n) });
  persist();
}
function addTimelineStop(tripId, fields){
  const t = findTrip(tripId); if(!t) return null;
  const tl = ensureTripTimeline(t);
  const stop = Object.assign({
    id:uid(), type:'stop', time:'', location:'', activity:'', notes:'', cost:'', link:'', spotItemId:''
  }, fields||{});
  // insert after last day divider (or at end)
  let insertAt = tl.length;
  for(let i=tl.length-1;i>=0;i--){
    if(tl[i].type==='day'){ insertAt = i+1; break; }
  }
  // if there is a "current" day hint - still append at end for simplicity when user picks day index
  if(fields && fields._afterDayId){
    const di = tl.findIndex(x=>x.id===fields._afterDayId);
    if(di>=0){
      let j = di+1;
      while(j<tl.length && tl[j].type==='stop') j++;
      insertAt = j;
    }
    delete stop._afterDayId;
  }
  tl.splice(insertAt, 0, stop);
  // auto-sort stops within each day by time if both have time
  sortTimelineByTime(t);
  persist();
  return stop;
}
function sortTimelineByTime(t){
  const tl = ensureTripTimeline(t);
  // group by day segments and sort stops with time
  let i = 0;
  while(i < tl.length){
    if(tl[i].type!=='day'){ i++; continue; }
    let j = i+1;
    while(j < tl.length && tl[j].type==='stop') j++;
    const segment = tl.slice(i+1, j);
    segment.sort((a,b)=>{
      const ta = (a.time||'').trim();
      const tb = (b.time||'').trim();
      if(ta && tb) return ta.localeCompare(tb);
      if(ta && !tb) return -1;
      if(!ta && tb) return 1;
      return 0;
    });
    for(let k=0;k<segment.length;k++) tl[i+1+k] = segment[k];
    i = j;
  }
}
function moveTimelineItem(tripId, itemId, toIndex){
  const t = findTrip(tripId); if(!t) return;
  const tl = ensureTripTimeline(t);
  const from = tl.findIndex(x=>x.id===itemId);
  if(from<0) return;
  const [item] = tl.splice(from, 1);
  const idx = Math.max(0, Math.min(toIndex, tl.length));
  tl.splice(idx, 0, item);
  persist();
}
function deleteTimelineItem(tripId, itemId){
  const t = findTrip(tripId); if(!t) return;
  const tl = ensureTripTimeline(t);
  const idx = tl.findIndex(x=>x.id===itemId);
  if(idx<0) return;
  // don't allow deleting the last day divider
  if(tl[idx].type==='day' && tl.filter(x=>x.type==='day').length<=1){
    toast('至少保留一個 Day 分隔');
    return;
  }
  tl.splice(idx, 1);
  persist();
}

function ensureTripForSpotBook(book){
  if(!book) return null;
  let trip = db.trips.find(t=>t.spotBookId===book.id);
  if(!trip){
    trip = {
      id: uid(),
      name: (book.name && book.name!=='新景點本') ? book.name : (book.place || 'New Trip'),
      destination: book.place || '',
      overview: book.notes || '',
      startDate: '', endDate: '', cover: '',
      spotBookId: book.id,
      days: [{ id:uid(), label:'Day 1', items:[] }],
      createdAt: Date.now()
    };
    db.trips.unshift(trip);
  } else {
    // keep name/destination in sync if trip still default-ish
    if(book.place) trip.destination = book.place;
    if(book.name && book.name!=='新景點本') trip.name = book.name;
    if(book.notes && !trip.overview) trip.overview = book.notes;
  }
  // ensure at least one day
  if(!Array.isArray(trip.days) || !trip.days.length){
    trip.days = [{ id:uid(), label:'Day 1', items:[] }];
  }
  // sync into timeline + legacy days
  const tl = ensureTripTimeline(trip);
  const day0 = trip.days[0];
  if(!Array.isArray(day0.items)) day0.items = [];
  (book.items||[]).forEach(sp=>{
    if(!sp.title && !sp.note) return;
    const existsTl = tl.some(x=>x.type==='stop' && x.spotItemId===sp.id);
    if(!existsTl){
      tl.push({
        id: uid(), type:'stop', time:'', location: sp.title||'',
        activity: sp.title || '景點', notes: sp.note||'', cost:'',
        link: sp.url||'', spotItemId: sp.id
      });
    } else {
      tl.forEach(x=>{
        if(x.type==='stop' && x.spotItemId===sp.id){
          x.activity = sp.title || x.activity;
          x.location = sp.title || x.location;
          x.notes = sp.note || x.notes;
          x.link = sp.url || x.link;
        }
      });
    }
  });
  return trip;
}

    v.script.forEach(s=>{ if((s.name+s.content).toLowerCase().includes(q)) res.push({kind:'Script', title:v.title+' — '+s.name, snippet:s.content.slice(0,80), hash:`#/youtube/idea/${v.id}/script`}); });
  });
  db.recipes.forEach(r=>{

  });
  db.tasks.forEach(t=>{
    if((t.title+t.notes).toLowerCase().includes(q)) res.push({kind:'Task', title:t.title, snippet:t.notes, hash:`#/calendar`});
  });
  db.trips.forEach(t=>{
    if((t.name+t.destination).toLowerCase().includes(q)) res.push({kind:'Trip', title:t.name, snippet:t.destination, hash:`#/travel/${t.id}`});
  });
  (db.watchlist||[]).forEach(w=>{
    if((w.title+' '+(w.channel||'')+' '+(w.category||'')+' '+(w.synopsis||'')).toLowerCase().includes(q))
      res.push({kind:'Watchlist', title:w.title, snippet:w.channel||w.category||'', hash:`#/watchlist/${w.id}`});

}

function navLink(n,top,inPinnedSection){
  ensurePinnedNav();
  const isPinned = db.pinnedNav.includes(n.seg);
  const pinBtn = inPinnedSection
    ? `<button type="button" class="icon-btn" style="margin-left:auto;opacity:.9;font-size:12px;color:inherit;padding:2px 4px;cursor:pointer;" data-action="unpin-nav" data-id="${n.seg}" title="取消釘選">📌</button>`
    : `<button type="button" class="icon-btn" style="margin-left:auto;opacity:.55;font-size:12px;color:inherit;padding:2px 4px;cursor:pointer;" data-action="pin-nav" data-id="${n.seg}" title="釘選到上方">${isPinned?'📌':'📍'}</button>`;
  return `<div class="nav-item ${top===n.seg?'active':''}" draggable="true" data-nav-seg="${n.seg}" data-nav-zone="${inPinnedSection?'pinned':'main'}" style="display:flex;align-items:center;gap:8px;padding-right:6px;cursor:grab;">
    <span style="opacity:.45;font-size:11px;user-select:none;" title="拖曳排序">⠿</span>
    <a href="#/${n.seg}" data-action="nav-close" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none;color:inherit;">
      <span class="ic">${n.ic}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(n.label)}</span>
    </a>

  </div>`;
}
function bindNavDrag(){
  let dragSeg = null, dragZone = null;
  document.querySelectorAll('[data-nav-seg]').forEach(el=>{
    el.addEventListener('dragstart', e=>{
      if(e.target.closest('button,a')){ /* allow but set data */ }
      dragSeg = el.getAttribute('data-nav-seg');
      dragZone = el.getAttribute('data-nav-zone');
      el.style.opacity = '0.45';
      try{ e.dataTransfer.setData('text/plain', dragSeg); e.dataTransfer.effectAllowed='move'; }catch(_){}
    });
    el.addEventListener('dragend', ()=>{ el.style.opacity=''; dragSeg=null; dragZone=null; });
    el.addEventListener('dragover', e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; el.style.outline='1px dashed rgba(115,191,0,0.5)'; });
    el.addEventListener('dragleave', ()=>{ el.style.outline=''; });
    el.addEventListener('drop', e=>{
      e.preventDefault();
      el.style.outline='';
      const targetSeg = el.getAttribute('data-nav-seg');
      const targetZone = el.getAttribute('data-nav-zone');
      if(!dragSeg || dragSeg===targetSeg) return;
      if(dragZone!==targetZone) return; // only reorder within same zone
      if(dragZone==='pinned'){
        ensurePinnedNav();
        const arr = db.pinnedNav.filter(s=>NAV_ITEMS.some(n=>n.seg===s));
        const from = arr.indexOf(dragSeg), to = arr.indexOf(targetSeg);
        if(from<0 || to<0) return;
        arr.splice(from,1); arr.splice(to,0,dragSeg);
        db.pinnedNav = arr;
      } else {
        ensureNavOrder();
        const arr = [...db.navOrder];
        const from = arr.indexOf(dragSeg), to = arr.indexOf(targetSeg);
        if(from<0 || to<0) return;
        arr.splice(from,1); arr.splice(to,0,dragSeg);
        db.navOrder = arr;
      }
      persist(); render();
    });
  });
}

function render(){
  const route = currentRoute();
  if(route.length===0){ location.hash = '#/dashboard'; return; }
  const page = route[0];
  let pageHTML='';
  try{
    if(page==='dashboard') pageHTML = renderDashboard();
    else if(page==='gallery') pageHTML = renderGallery(route);
    else if(page==='learning') pageHTML = renderLearning(route);
    else if(page==='youtube') pageHTML = renderYoutube(route);
    else if(page==='recipes') pageHTML = renderRecipes(route);
    else if(page==='calendar') pageHTML = renderCalendar(route);
    else if(page==='weekly') pageHTML = renderWeekly(route);
    else if(page==='wishlist') pageHTML = renderWishlist();
    else if(page==='watchlist') pageHTML = renderWatchlist(route);
    else if(page==='lookbook') pageHTML = renderLookbook(route);
    else if(page==='travel') pageHTML = renderTravel(route);
    else if(page==='review') pageHTML = renderReview(route);
    else if(page==='mood') pageHTML = renderMood();
    else if(page==='search') pageHTML = renderSearch(route);
    else pageHTML = `<div class="empty-state"><div class="glyph">✦</div><div class="msg">Page not found</div><a class="btn btn-primary" href="#/dashboard">Return to Dashboard</a></div>`;
  }catch(e){
    console.error(e);
    pageHTML = `<div class="empty-state"><div class="glyph">⚠</div><div class="msg">Something went wrong rendering this page.</div><a class="btn btn-primary" href="#/dashboard">Return to Dashboard</a></div>`;
  }

  document.getElementById('app').innerHTML = `
    ${sidebarHTML(route)}
    <div class="main">
      ${topbarHTML()}
      <div class="content">${pageHTML}</div>
      ${bottomNavHTML(route)}
    </div>
    ${ui.drawer? renderDrawer() : ''}
    ${ui.modal? renderModal() : ''}
  `;
  wireInputs();
  bindNavDrag();
  wireEveningEditors();
  // weather chip (dashboard)
  if(document.getElementById('weatherChip')) refreshWeatherChip();
  wireTripDrag();
  // external links always new tab
  document.querySelectorAll('a[href^="http"]').forEach(a=>{
    a.setAttribute('target','_blank');
    a.setAttribute('rel','noopener noreferrer');
  });
  // gallery memory image
  if(typeof hydrateGalleryImages==='function') hydrateGalleryImages();
  // keep text selection when clicking format / sticker buttons
  document.querySelectorAll('.ew-fmt button, .ew-fmt select, .ew-sticker-panel button').forEach(btn=>{
    btn.addEventListener('mousedown', (e)=>{ e.preventDefault(); ewSaveSelection(); });
  });
  // change handlers for ew selects
  document.querySelectorAll('[data-action-change="ew-font"]').forEach(el=>{
    el.addEventListener('change', ()=> ewFmt('fontName', el.value));
  });
  document.querySelectorAll('[data-action-change="ew-size"]').forEach(el=>{
    el.addEventListener('change', ()=> ewFmt('fontSize', el.value));
  });
  document.querySelectorAll('[data-action-change="ew-year"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const y = parseInt(el.value,10);
      const m = parseInt((ui.calMonth||todayISO()).slice(5,7),10);
      const iso = `${y}-${String(m).padStart(2,'0')}-01`;
      ui.calMonth = iso.slice(0,7);
      ui.dashWeekStart = getWeekStart(iso);
      render();
    });
  });
  document.querySelectorAll('[data-action-change="ew-month"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const m = parseInt(el.value,10);
      const y = parseInt((ui.calMonth||todayISO()).slice(0,4),10);
      const iso = `${y}-${String(m).padStart(2,'0')}-01`;
      ui.calMonth = iso.slice(0,7);
      ui.dashWeekStart = getWeekStart(iso);
      render();
    });
  });
}

function wireInputs(){
  document.querySelectorAll('[data-bind]').forEach(el=>{
    const evtName = (el.tagName==='SELECT' || el.type==='checkbox' || el.type==='date' || el.type==='time' || el.type==='radio') ? 'change' : 'input';
    el.addEventListener(evtName, (e)=>handleBind(el, e));
  });
  document.querySelectorAll('[data-bind-blur]').forEach(el=>{
    el.addEventListener('blur', (e)=>handleBindBlur(el,e));
  });
  const fi = document.getElementById('firstFocus');
  if(fi){ fi.focus(); if(fi.select) try{fi.select();}catch(e){} }

  // dynamic image file inputs
  const recipeImg = document.getElementById('recipeImgInput');
  if(recipeImg){ const rid = currentRoute()[1]; bindImageFile(recipeImg, dataUrl=>{ const r=findRecipe(rid); if(r) r.image=dataUrl; }); }
  document.querySelectorAll('.recipeBlockImgInput').forEach(inp=>{
    bindImageFile(inp, dataUrl=>{ const r=findRecipe(inp.getAttribute('data-rid')); const b=r&&r.blocks.find(x=>x.id===inp.getAttribute('data-bid')); if(b) b.url=dataUrl; });
  });
  document.querySelectorAll('.wishImgInput').forEach(inp=>{
    bindImageFile(inp, dataUrl=>{ const w=findWish(inp.getAttribute('data-wid')); if(w) w.image=dataUrl; });
  });
  const tripCover = document.getElementById('tripCoverInput');
  if(tripCover){ bindImageFile(tripCover, dataUrl=>{ const t=findTrip(tripCover.getAttribute('data-tid')); if(t) t.cover=dataUrl; }); }
  const galleryUpload = document.getElementById('galleryUploadInput');
  if(galleryUpload){
    const albumId = currentRoute()[2];
    galleryUpload.addEventListener('change', ()=>{ if(galleryUpload.files.length) saveGalleryFiles(albumId,galleryUpload.files); });
  }
  document.querySelectorAll('.lookDetailImgInput').forEach(inp=>{
    bindImageFile(inp, dataUrl=>{
      const look = findLook(inp.getAttribute('data-lid'));
      if(look){ look.photo=dataUrl; look.updatedAt=Date.now(); persist(); render(); }
    });
  });
  document.querySelectorAll('.lookPartImgInput').forEach(inp=>{
    bindImageFile(inp, dataUrl=>{
      const look = findLook(inp.getAttribute('data-lid'));
      const part = inp.getAttribute('data-part');
      if(look && part){ normalizeLook(look); look[part].photo=dataUrl; look.updatedAt=Date.now(); persist(); render(); }
    });
  });
  hydrateGalleryImages();
}

function findGoal(id){ return db.learningGoals.find(g=>g.id===id); }
function findIdea(id){ return db.youtubeIdeas.find(v=>v.id===id); }
function findRecipe(id){ return db.recipes.find(r=>r.id===id); }
function findTask(id){ return db.tasks.find(t=>t.id===id); }
function findEvent(id){ return db.events.find(e=>e.id===id); }
function findWish(id){ return db.wishlist.find(w=>w.id===id); }
function findTrip(id){ return db.trips.find(t=>t.id===id); }

function handleBind(el, e){
  const spec = el.getAttribute('data-bind');
  const parts = spec.split('::');
  const key = parts[0];
  const isCE = el.isContentEditable || el.getAttribute('contenteditable')==='true';
  const val = el.type==='checkbox' ? el.checked : (isCE ? el.innerText : el.value);

  if(key==='search'){ ui.searchQuery = val; return; } // no persist, handled on submit
  if(key==='journalQuery'){ ui.journalQuery = val; return; }
  if(key==='ytSearchQuery'){ ui.ytSearchQuery = val; return; }
  if(key==='ytTypeFilter'){ ui.ytTypeFilter = val; render(); return; }
  if(key==='quicknote'){ db.quickNote = val; persistDebounced(); return; }

  if(key.startsWith('goal.')){
    const g = findGoal(parts[1]); if(!g) return;
    const field = key.split('.')[1];
    g[field] = val; g.updatedAt = Date.now(); persistDebounced(); return;
  }
  if(key.startsWith('curriculum.')){
    const g = findGoal(parts[1]); if(!g) return;
    const c = g.curriculum.find(x=>x.id===parts[2]); if(!c) return;
    c.text = val; g.updatedAt = Date.now(); persistDebounced(); return;
  }
  if(key.startsWith('studylog.')){
    ensureGlobalStudyLogs();
    const log = findStudyLog(parts[1]); if(!log) return;
    const field = key.split('.')[1];
    log[field] = val;
    if(field==='goalId'){
      const g = findGoal(val);
      log.goalTitle = g ? g.title : '';
    }
    persistDebounced(); return;
  }
  if(key.startsWith('idea.')){
    const v = findIdea(parts[1]); if(!v) return;
    const field = key.split('.')[1];
    v[field] = val; v.updatedAt = Date.now(); persistDebounced(); return;
  }
  if(key.startsWith('script.')){
    const v = findIdea(parts[1]); if(!v) return;
    const s = v.script.find(x=>x.id===parts[2]); if(!s) return;
    const field = key.split('.')[1];
    s[field] = val; v.updatedAt = Date.now(); persistDebounced(); return;
  }
  if(key.startsWith('recipe.')){
    const r = findRecipe(parts[1]); if(!r) return;
    const field = key.split('.')[1];
    r[field] = field==='rating' ? (parseInt(val,10)||0) : val;
    r.updatedAt = Date.now(); persistDebounced(); return;
  }
  if(key.startsWith('block.')){
    const r = findRecipe(parts[1]); if(!r) return;
    const b = r.blocks.find(x=>x.id===parts[2]); if(!b) return;
    const field = key.split('.')[1];
    b[field] = val; r.updatedAt = Date.now(); persistDebounced(); return;
  }
  if(key.startsWith('blockitem.')){
    const r = findRecipe(parts[1]); if(!r) return;
    const b = r.blocks.find(x=>x.id===parts[2]); if(!b) return;
    const it = b.items.find(x=>x.id===parts[3]); if(!it) return;
    it.text = val; r.updatedAt = Date.now(); persistDebounced(); return;
  }
  if(key.startsWith('task.')){
    const t = findTask(parts[1]); if(!t) return;
    const field = key.split('.')[1];
    t[field] = val; persistDebounced(); if(field==='dueDate'||field==='priority') render(); return;
  }
  if(key.startsWith('event.')){
    const ev = findEvent(parts[1]); if(!ev) return;
    const field = key.split('.')[1];
    ev[field] = val; persistDebounced(); return;
  }
  if(key.startsWith('weekitem.')){
    const wp = getWeekPlan(parts[1]); const day=parts[2];
    const it = wp[day].find(x=>x.id===parts[3]); if(!it) return;
    it.text = val; persistDebounced(); return;
  }
  if(key.startsWith('wish.')){
    const w = findWish(parts[1]); if(!w) return;
    const field = key.split('.')[1];
    w[field] = field==='price' ? (parseFloat(val)||0) : val;
    persistDebounced(); if(field==='price') render(); return;
  }
  if(key.startsWith('watch.')){
    const w = findWatch(parts[1]); if(!w) return;
    const field = key.split('.')[1];
    w[field] = val; w.updatedAt = Date.now(); persistDebounced(); return;
  }
  if(key==='watchQuery'){ ui.watchQuery = val; return; }
  if(key==='watchFilter'){ ui.watchFilter = val; render(); return; }
  if(key==='watchStatus'){ ui.watchStatus = val; render(); return; }
  if(key.startsWith('spotbook.')){
    const b = findSpotBook(parts[1]); if(!b) return;
    const field = key.split('.')[1];
    b[field] = val; b.updatedAt = Date.now();
    ensureTripForSpotBook(b);
    persistDebounced(); return;
  }
  if(key.startsWith('spotitem.')){
    const b = findSpotBook(parts[1]); if(!b) return;
    const it = (b.items||[]).find(x=>x.id===parts[2]); if(!it) return;
    const field = key.split('.')[1];
    it[field] = val; b.updatedAt = Date.now();
    ensureTripForSpotBook(b);
    persistDebounced(); return;
  }
  if(key.startsWith('trip.')){
    const t = findTrip(parts[1]); if(!t) return;
    const field = key.split('.')[1];
    t[field] = val; persistDebounced(); return;
  }
  if(key.startsWith('day.')){
    const t = findTrip(parts[1]); if(!t) return;
    const d = t.days.find(x=>x.id===parts[2]); if(!d) return;
    d.label = val; persistDebounced(); return;
  }
  if(key.startsWith('dayitem.')){
    const t = findTrip(parts[1]); if(!t) return;
    const d = t.days.find(x=>x.id===parts[2]); if(!d) return;
    const it = d.items.find(x=>x.id===parts[3]); if(!it) return;
    const field = key.split('.')[1];
    it[field] = val; persistDebounced(); return;
  }
  if(key.startsWith('tl.')){
    const t = findTrip(parts[1]); if(!t) return;
    const tl = ensureTripTimeline(t);
    const node = tl.find(x=>x.id===parts[2]); if(!node) return;
    const field = key.split('.')[1];
    if(field==='daylabel') node.label = val;
    else node[field] = val;
    persistDebounced(); return;
  }
  if(key.startsWith('reviewcheck.')){
    const ym = parts[1], ck = parts[2], itemId = parts[3];
    const rv = ensureReview(ym);
    if(!rv.checklists[ck]) rv.checklists[ck] = [];
    const it = rv.checklists[ck].find(x=>x.id===itemId);
    if(it){ it.text = val; persistDebounced(); }
    return;
  }
  if(key.startsWith('review.')){
    const ym = parts[1];
    ensureReview(ym);
    const field = key.split('.')[1];
    db.monthlyReviews[ym][field] = (field.startsWith('rating') || field==='overall') ? (parseInt(val,10)||5) : val;
    persistDebounced(); return;
  }
  if(key.startsWith('mood.')){
    const date = parts[1];
    let m = db.moods.find(x=>x.date===date);
    if(!m){ m={id:uid(),date,mood:'',note:'',tags:[]}; db.moods.push(m); }
    m.note = val; persistDebounced(); return;
  }
  if(key.startsWith('journal.')){
    const date=parts[1]; const j=getJournalForDate(date); const field=key.split('.')[1];
    j[field]=val; j.updatedAt=Date.now(); persistDebounced(); return;
  }
  if(key==='gallery.note'){
    const albumId=parts[1], photoId=parts[2]; const ph=findGalleryPhoto(albumId,photoId);
    if(ph){ ph.note=val; const al=findGalleryAlbum(albumId); if(al) al.updatedAt=Date.now(); persistDebounced(); }
    return;
  }
  if(key==='lookbookQuery'){ ui.lookbookQuery = val; return; }
  if(key.startsWith('look.')){
    const look = findLook(parts[1]); if(!look) return;
    const field = key.split('.')[1];
    // don't overwrite part objects
    if(['head','upper','lower','accessories'].includes(field)) return;
    look[field] = val; look.updatedAt = Date.now(); persistDebounced(); return;
  }
  if(key.startsWith('lookpart.')){
    const look = findLook(parts[1]); if(!look) return;
    normalizeLook(look);
    const part = parts[2];
    const field = key.split('.')[1]; // text or url
    if(look[part]){ look[part][field]=val; look.updatedAt=Date.now(); persistDebounced(); }
    return;
  }
}

/* Image file -> dataURL for cover/recipe images */
function bindImageFile(inputEl, cb){
  inputEl.addEventListener('change', ()=>{
    const file = inputEl.files[0]; if(!file) return;
    if(file.size > 8*1024*1024){ toast('Image too large — please use one under 8MB.'); return; }
    const reader = new FileReader();
    reader.onload = ()=>{ cb(reader.result); persist(); render(); };
    reader.onerror = ()=>{ toast('Could not read file from computer.'); };
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   GLOBAL CLICK / SUBMIT DELEGATION
   ============================================================ */
document.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.getAttribute('data-action');
  const id = t.getAttribute('data-id');
  const id2 = t.getAttribute('data-id2');
  const id3 = t.getAttribute('data-id3');

  switch(action){
    case 'toggle-sidebar': ui.sidebarOpen = !ui.sidebarOpen; render(); break;
    case 'close-sidebar': ui.sidebarOpen = false; break; // let the <a> navigate naturally
    case 'nav-close': ui.sidebarOpen = false; break;
    case 'pin-nav': {
      ensurePinnedNav();
      // unlimited pins; if already pinned, move to front
      db.pinnedNav = db.pinnedNav.filter(s=>s!==id);
      db.pinnedNav.unshift(id);
      persist(); toast('已釘選 📌'); render();
      break;
    }
    case 'unpin-nav': {
      ensurePinnedNav();
      db.pinnedNav = db.pinnedNav.filter(s=>s!==id);
      persist(); toast('已取消釘選'); render();
      break;
    }

    case 'open-quickadd': ui.modal = {type:'quickadd', kind:'task'}; render(); break;
    case 'close-modal': {
      // overlay: only close when clicking the backdrop itself (not children)
      if(t.classList.contains('overlay') && e.target !== t) break;
      ui.modal = null;
      render();
      break;
    }
    case 'close-drawer': {
      if(t.classList.contains('drawer-overlay') && e.target !== t) break;
      ui.drawer = null;

let _ewSavedRange = null;
let _ewSavedEditor = null;

function ewGetEditor(){
  const focused = document.querySelector('.ew-slot-editor.ew-focused, .rt-editor.rt-focused');
  if(focused) return focused;
  if(ui.dashActiveEditor){
    const el = document.getElementById(ui.dashActiveEditor);
    if(el) return el;
  }
  return _ewSavedEditor;
}
function ewSaveSelection(){
  const ed = document.querySelector('.ew-slot-editor.ew-focused') || _ewSavedEditor;
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0) return;
  const range = sel.getRangeAt(0);
  // only save if inside an evening editor
  const node = range.commonAncestorContainer;
  const editor = (node.nodeType===1?node:node.parentElement)?.closest?.('.ew-slot-editor, .rt-editor');
  if(editor){
    _ewSavedRange = range.cloneRange();
    _ewSavedEditor = editor;
  }
}
function ewRestoreSelection(){
  const ed = ewGetEditor();
  if(!ed) return false;
  ed.focus();
  const sel = window.getSelection();
  if(_ewSavedRange && _ewSavedEditor===ed){
    try{
      sel.removeAllRanges();
      sel.addRange(_ewSavedRange);
      return true;
    }catch(_){}
  }
  // fallback: caret at end
  try{
    const range = document.createRange();
    range.selectNodeContents(ed);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  }catch(_){}
  return true;
}
function ewPersistEditor(ed){
  if(!ed) return;
  const iso = ed.getAttribute('data-date');
  const slot = ed.getAttribute('data-slot');
  if(iso && slot) setEveningHtml(iso, slot, ed.innerHTML);
  // YouTube progress note
  const pid = ed.getAttribute('data-progress-id');
  if(pid){
    const v = findIdea(pid);
    if(v){ v.progressNote = ed.innerHTML; v.updatedAt = Date.now(); persistDebounced(); }
  }
}
function ewFmt(cmd, val){
  const ed = ewGetEditor();
  if(!ed){ toast('先點一下要編輯的時段格子再選格式'); return; }
  ewRestoreSelection();
  try{
    document.execCommand('styleWithCSS', false, true);
    if(cmd==='fontName') document.execCommand('fontName', false, val);
    else if(cmd==='fontSize') document.execCommand('fontSize', false, String(val));
    else if(cmd==='foreColor') document.execCommand('foreColor', false, val);
    else if(cmd==='hiliteColor'){
      // try both
      const ok = document.execCommand('hiliteColor', false, val);
      if(!ok) document.execCommand('backColor', false, val);
    }
    else if(cmd==='fontSizePx'){
      // wrap selection in span with font-size
      const sel = window.getSelection();
      if(sel && sel.rangeCount && !sel.isCollapsed){
        const range = sel.getRangeAt(0);
        const span = document.createElement('span');
        span.style.fontSize = val;
        range.surroundContents(span);
      } else {
        document.execCommand('fontSize', false, '4');
      }
    }
    else document.execCommand(cmd, false, val||null);
  }catch(err){ console.warn('ewFmt', err); toast('此格式在目前選取範圍無法套用'); }
  ewSaveSelection();
  ewPersistEditor(ed);
}
function ewInsertSticker(emoji){
  const ed = ewGetEditor();
  if(!ed){ toast('先點一下要編輯的時段格子'); return; }
  ewRestoreSelection();
  try{
    const ok = document.execCommand('insertText', false, emoji);
    if(!ok){
      const sel = window.getSelection();
      if(sel && sel.rangeCount){
        const range = sel.getRangeAt(0);
        range.deleteContents();
        const tn = document.createTextNode(emoji);
        range.insertNode(tn);
        range.setStartAfter(tn);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      } else {
        ed.appendChild(document.createTextNode(emoji));
      }
    }
  }catch(err){
    ed.innerHTML += emoji;
  }
  ewSaveSelection();
  ewPersistEditor(ed);
}

function wireRichEditors(){
  document.querySelectorAll('.ew-slot-editor, .rt-editor').forEach(ed=>{
    if(ed._rtWired) return;
    ed._rtWired = true;
    ed.addEventListener('focus', ()=>{
      document.querySelectorAll('.ew-slot-editor').forEach(x=>x.classList.remove('ew-focused'));
      document.querySelectorAll('.rt-editor').forEach(x=>x.classList.remove('rt-focused'));
      if(ed.classList.contains('ew-slot-editor')) ed.classList.add('ew-focused');
      if(ed.classList.contains('rt-editor')) ed.classList.add('rt-focused');
      ui.dashActiveEditor = ed.id;
      _ewSavedEditor = ed;
    });
    ed.addEventListener('keyup', ewSaveSelection);
    ed.addEventListener('mouseup', ewSaveSelection);
    ed.addEventListener('input', ()=>{
      ewSaveSelection();
      ewPersistEditor(ed);
    });
    ed.addEventListener('blur', ()=>{
      ewPersistEditor(ed);
      persist();
    });
    ed.addEventListener('paste', (e)=>{
      const items = e.clipboardData && e.clipboardData.items;
      if(!items) return;
      for(const it of items){
        if(it.type && it.type.startsWith('image/')){
          e.preventDefault();
          const file = it.getAsFile();
          if(!file || file.size > 2*1024*1024){ toast('貼上圖片請小於 2MB'); return; }
          const reader = new FileReader();
          reader.onload = ()=>{
            ed.focus();
            document.execCommand('insertImage', false, reader.result);
            ewPersistEditor(ed);
          };
          reader.readAsDataURL(file);
          return;
        }
      }
    });
  });
}
function wireEveningEditors(){
  wireRichEditors();
  // continuous selection tracking (once)
  if(!window._ewSelTrack){
    window._ewSelTrack = true;
    document.addEventListener('selectionchange', ()=>{
      const sel = window.getSelection();
      if(!sel || !sel.rangeCount) return;
      const node = sel.anchorNode;
      if(!node) return;
      const el = node.nodeType===1 ? node : node.parentElement;
      if(el && el.closest && el.closest('.ew-slot-editor, .rt-editor')) ewSaveSelection();
    });
  }
}

const TC_LAT = 24.1676, TC_LON = 120.6820;
const WEATHER_CACHE_KEY = 'lifeos_weather_taichung_bei';
function weatherEmoji(code){
  const c = Number(code);
  if(c===0) return '☀️';
  if(c<=3) return '🌤️';
  if(c<=48) return '🌫️';
  if(c<=57) return '🌦️';
  if(c<=67) return '🌧️';
  if(c<=77) return '❄️';
  if(c<=82) return '🌧️';
  if(c<=86) return '🌨️';
  if(c<=99) return '⛈️';
  return '🌡️';
}
function weatherLabel(code){
  const c = Number(code);
  if(c===0) return '晴朗';
  if(c===1) return '大致晴';
  if(c===2) return '多雲';
  if(c===3) return '陰天';
  if(c<=48) return '有霧';
  if(c<=57) return '毛毛雨';
  if(c<=67) return '雨';
  if(c<=77) return '雪';
  if(c<=82) return '陣雨';
  if(c<=86) return '雪陣';
  if(c<=99) return '雷雨';
  return '天氣';
}
function getCachedWeather(){
  try{
    const raw = localStorage.getItem(WEATHER_CACHE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    // refresh at least every 30 min
    if(data && data.fetchedAt && (Date.now()-data.fetchedAt) < 30*60*1000) return data;
    return data; // still show stale while refreshing
  }catch(e){ return null; }
}
function setCachedWeather(data){
  try{ localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(data)); }catch(e){}
}
async function fetchTaichungWeather(force){
  const cached = getCachedWeather();
  if(!force && cached && cached.daily && cached.daily.length && cached.fetchedAt && (Date.now()-cached.fetchedAt) < 30*60*1000){
    return cached;
  }
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${TC_LAT}&longitude=${TC_LON}&current=temperature_2m,weather_code,relative_humidity_2m,apparent_temperature&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=7&timezone=Asia%2FTaipei`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('weather http '+res.status);
    const json = await res.json();
    const cur = json.current || {};
    const daily = json.daily || {};
    const days = [];
    const dates = daily.time || [];
    for(let i=0;i<dates.length;i++){
      const code = (daily.weather_code||[])[i];
      days.push({
        date: dates[i],
        code,
        emoji: weatherEmoji(code),
        label: weatherLabel(code),
        tmax: (daily.temperature_2m_max||[])[i],
        tmin: (daily.temperature_2m_min||[])[i]
      });
    }
    const data = {
      temp: cur.temperature_2m,
      feels: cur.apparent_temperature,
      humidity: cur.relative_humidity_2m,
      code: cur.weather_code,
      emoji: weatherEmoji(cur.weather_code),
      label: weatherLabel(cur.weather_code),
      place: '台中市北區',
      fetchedAt: Date.now(),
      date: todayISO(),
      daily: days
    };
    setCachedWeather(data);
    return data;
  }catch(e){
    console.warn('weather fetch failed', e);
    return cached || null;
  }
}
async function openWeatherForecast(){
  let data = getCachedWeather();
  const need = !data || !data.daily || !data.daily.length;
  try{
    data = await fetchTaichungWeather(need);
  }catch(e){ console.warn(e); }
  if(!data || !data.daily || !data.daily.length){
    // one more forced try
    data = await fetchTaichungWeather(true);
  }
  ui.modal = { type:'weatherForecast', weather: data };
  render();
}

  ensureGlobalStudyLogs();
  const logs = db.studyLogs || [];

/* ============================================================
   PAGE: YOUTUBE STUDIO — Ideas bank + Script bookshelf
   ============================================================ */
function statusPillClass(st){
  if(st==='Published') return 'pill-verd';
  if(st==='Idea') return 'pill-gray';
  if(st==='Filming'||st==='Editing') return 'pill-ox';
  return 'pill-gold';
}
function renderYoutube(route){
  // #/youtube/book/:id  → full script book
  if(route[1]==='book' && route[2]){
    ui.drawer = null;
    return renderScriptBook(route[2]);
  }
  // #/youtube/idea/:id  → idea detail (optional /script redirects to book)
  if(route[1]==='idea' && route[2]){
    if(route[3]==='script'){
      // legacy path → open as book
      nav(`#/youtube/book/${route[2]}`);
      return '';
    }
    ui.drawer = null;
    return renderIdeaDetail(route[2]);
  }
  ui.drawer = null;

  // normalize all for migration
  db.youtubeIdeas.forEach(normalizeIdea);

  const q = (ui.ytSearchQuery||'').trim().toLowerCase();
  const typeF = ui.ytTypeFilter || 'all';
  const tab = ui.ytTab || 'books';

  let ideas = db.youtubeIdeas.filter(v=>!v.isBook);
  let books = db.youtubeIdeas.filter(v=>v.isBook);

  const filterList = (list)=>{
    let out = [...list];
    if(typeF!=='all') out = out.filter(v=>v.type===typeF);
    if(q) out = out.filter(v=>{
      const blob = (v.title+' '+v.type+' '+(v.location||'')+' '+(v.status||'')+' '+(v.notes||'')+' '+(v.script||[]).map(s=>s.name+' '+s.content).join(' ')).toLowerCase();
      return blob.includes(q);
    });
    return out.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  };
  ideas = filterList(ideas);
  books = filterList(books);
  const shown = tab==='ideas' ? ideas : books;

  return `
  ${artPageBanner('youtube','🎬 Creator Space','YouTube Studio','點子庫 · 腳本書架')}
  <div class="page-header">
    <div></div>
    <button class="btn btn-primary" data-action="add-idea">+ 新點子</button>
  </div>

  <div class="panel" style="margin-bottom:16px;">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <input class="field" id="ytSearchInput" style="flex:1;min-width:160px;" type="text" placeholder="搜尋標題、type、腳本內容…" value="${esc(ui.ytSearchQuery)}" data-bind="ytSearchQuery">
      <button class="btn btn-ghost btn-sm" data-action="yt-search">🔍 Search</button>
      <select class="field" style="width:150px;" data-bind="ytTypeFilter">
        <option value="all" ${typeF==='all'?'selected':''}>全部 Type</option>
        ${db.ytTypes.map(ty=>`<option value="${esc(ty)}" ${typeF===ty?'selected':''}>${esc(ty)}</option>`).join('')}
      </select>
      <button class="btn btn-ghost btn-sm" data-action="add-ytype">+ Type</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
      <button class="btn ${tab==='books'?'btn-primary':'btn-ghost'} btn-sm" data-action="yt-tab" data-val="books">📚 腳本書架 · ${books.length}</button>
      <button class="btn ${tab==='ideas'?'btn-primary':'btn-ghost'} btn-sm" data-action="yt-tab" data-val="ideas">💡 點子庫 · ${ideas.length}</button>
    </div>
  </div>

  ${tab==='ideas' ? renderYtIdeasGrid(ideas) : renderYtBooksGrid(books)}
  `;
}

function renderYtIdeasGrid(ideas){
  if(ideas.length===0){
    return `<div class="empty-state">
      <div class="glyph">💡</div>
      <div class="msg">點子庫還是空的</div>
      <div class="fine" style="margin-bottom:12px;">先把靈感丟進來，之後再從點子「開成腳本冊」</div>

  return `

  <div class="grid cols-3">
    ${ideas.map(v=>`
      <div class="card card-click" onclick="location.hash='#/youtube/idea/${v.id}'">
        <div style="display:flex;justify-content:space-between;gap:6px;align-items:flex-start;">
          <div style="font-family:var(--font-display);font-weight:600;font-size:17px;">${esc(v.title)||'未命名點子'}</div>
          <span class="pill pill-gray">Idea</span>
        </div>
        <div class="mt8"><span class="pill pill-gold">${esc(v.type)}</span></div>
        <div class="fine mt8" style="min-height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">
          ${esc((v.notes||'').slice(0,100))||'尚無備註…'}
        </div>
        <div class="fine mt8">${fmtDateShort(toLocalISODate(new Date(v.updatedAt||v.createdAt)))}</div>
      </div>
    `).join('')}
  </div>`;
}

    return `<div class="empty-state">
      <div class="glyph">📚</div>
      <div class="msg">書架上還沒有腳本冊</div>

  <div class="grid cols-3">
    ${books.map(v=>{
      const sections = (v.script||[]).length;
      const words = (v.script||[]).reduce((n,s)=>n+String(s.content||'').length,0);
      return `
      <div class="card" style="padding:0;overflow:hidden;">
        <div onclick="location.hash='#/youtube/book/${v.id}'" style="cursor:pointer;">
          <div style="height:110px;background:linear-gradient(145deg,var(--verdigris),var(--gold));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px;">
            <div style="font-size:28px;opacity:.9;">🎬</div>
            <div style="font-family:var(--font-display);color:var(--paper);font-size:15px;font-weight:600;text-align:center;line-height:1.25;">${esc(v.title)||'未命名腳本'}</div>
          </div>
          <div style="padding:12px 14px 4px;">
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <span class="pill pill-gold">${esc(v.type)}</span>
              <span class="pill ${statusPillClass(v.status)}">${esc(v.status)}</span>
            </div>
            <div class="fine mt8">${sections} 段落 · ${words} 字${v.duration?' · '+esc(v.duration):''}</div>
          </div>
        </div>
        <div style="padding:8px 14px 12px;display:flex;justify-content:space-between;align-items:center;">
          <span class="fine">${fmtDateShort(toLocalISODate(new Date(v.updatedAt||v.createdAt)))}</span>
          <button class="btn btn-danger btn-sm" data-action="delete-idea-confirm" data-id="${v.id}">刪除</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

    <div class="panel">
      <div class="panel-title">點子資訊</div>
      <div class="field-group">
        <label class="flabel">Type</label>
        <select class="field" data-bind="idea.type::${v.id}">

function renderRecipeBlock(r,b,i){
  const ctrl = `<div class="block-controls">
      <button class="icon-btn" data-action="move-block" data-id="${r.id}" data-id2="${b.id}" data-dir="up">↑</button>

  return '';
}

function renderCalendar(route){

function renderWeekly(route){
  if(!ui.plannerView) ui.plannerView = 'week';

function renderPlanner(route){
  const view = ui.plannerView || 'week';
  const today = todayISO();
  const selectedDate = route[1]==='day' ? route[2] : (ui.dashSelectedDate || '');

  // keep weekStart aligned when month changes
  if(!ui.weekStart) ui.weekStart = getWeekStart(today);
  const weekStart = ui.weekStart;
  const weekEnd = addDays(weekStart, 6);
  const wp = getWeekPlan(weekStart);
  const prog = weekProgress(weekStart);

  const allOpenTasks = db.tasks.filter(t=>!t.completed).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
  const doneTasks = db.tasks.filter(t=>t.completed);
  const completionPct = db.tasks.length? Math.round((doneTasks.length/db.tasks.length)*100) : 0;
  const selectedTasks = selectedDate ? db.tasks.filter(t=>t.dueDate===selectedDate) : [];
  const selectedEvents = selectedDate ? db.events.filter(e=>e.date===selectedDate) : [];

  // Month grid data
  const [y,m] = ui.calMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const startDow = (first.getDay()+6)%7;
  const daysInMonth = new Date(y, m, 0).getDate();
  const monthLabel = first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = new Date(iso+'T12:00:00').getDay();
    const isWeekend = dow===0 || dow===6;
    const dayEvents = db.events.filter(e=>e.date===iso);
    const dayTasks = db.tasks.filter(t=>t.dueDate===iso && !t.completed);
    const inWeek = iso >= weekStart && iso <= weekEnd;
    cells += `<div class="cal-day ${iso===today?'today ':''}${isWeekend?'weekend ':''}${iso===selectedDate?'selected-date':''}${inWeek?' ' :''}" data-action="planner-select-day" data-id="${iso}" style="${inWeek && view==='month'?'outline:1px solid rgba(115,191,0,0.35);':''}">
      <div class="num">${d}</div>
      ${dayTasks.length? `<div class="evt" style="background:var(--oxblood);">${dayTasks.length} todo</div>`:''}
      ${dayEvents.slice(0,2).map(e=>`<div class="evt">${esc(e.title)}</div>`).join('')}
    </div>`;
  }

  const dayNames = {Mon:'一 Mon',Tue:'二 Tue',Wed:'三 Wed',Thu:'四 Thu',Fri:'五 Fri',Sat:'六 Sat',Sun:'日 Sun'};

  // Week columns
  const weekCols = WEEK_DAYS.map((d,i)=>{
    const iso = addDays(weekStart, i);
    const isToday = iso===today;
    const isWeekend = i>=5;
    const dayTasks = db.tasks.filter(t=>t.dueDate===iso);
    const dayEvents = db.events.filter(e=>e.date===iso);
    const items = wp[d]||[];
    const openT = dayTasks.filter(t=>!t.completed).length;
    return `
    <div class="week-col ${isWeekend?'planner-weekend':''} ${isToday?'planner-today':''}" style="${isWeekend?'background:#E4F0D8;':''}${isToday?'box-shadow:0 0 0 2px rgba(115,191,0,0.35) inset;':''}">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line);">
        <div>
          <div class="small-cap">${dayNames[d]}</div>
          <div style="font-family:var(--font-display);font-size:18px;font-weight:600;cursor:pointer;" data-action="planner-select-day" data-id="${iso}">${iso.slice(8)}</div>
        </div>
        ${isToday?'<span class="pill pill-verd">今天</span>':''}
      </div>
      ${dayEvents.length? dayEvents.map(e=>`
        <div class="fine" style="margin-bottom:4px;padding:3px 6px;background:var(--verdigris);color:var(--paper);border-radius:4px;font-size:11px;">
          ${e.time?esc(e.time)+' · ':''}${esc(e.title)}
        </div>`).join(''):''}
      ${dayTasks.length?`
        <div class="small-cap" style="margin:6px 0 4px;">To-do · ${openT}/${dayTasks.length}</div>
        ${dayTasks.slice(0,4).map(tk=>`
          <div class="item-row" style="padding:3px 0;">
            <input type="checkbox" class="checkbox" ${tk.completed?'checked':''} data-action="toggle-task" data-id="${tk.id}">
            <div class="txt ${tk.completed?'done':''}" style="font-size:12.5px;">${esc(tk.title)}</div>
          </div>`).join('')}
        ${dayTasks.length>4?`<div class="fine">+${dayTasks.length-4} more</div>`:''}
      `:''}
      <div class="small-cap" style="margin:8px 0 4px;">本週目標</div>
      ${items.map(it=>`
        <div class="item-row" style="padding:4px 0;">
          <input type="checkbox" class="checkbox" ${it.done?'checked':''} data-action="week-toggle-item" data-id="${d}" data-id2="${it.id}">
          <div class="txt ${it.done?'done':''}" contenteditable="true" style="font-size:12.5px;" data-bind="weekitem.text::${weekStart}::${d}::${it.id}" data-bind-blur="1">${esc(it.text)}</div>
          <div class="row-actions"><button class="icon-btn" data-action="week-delete-item" data-id="${d}" data-id2="${it.id}">✕</button></div>
        </div>
      `).join('')}
      <button class="btn btn-ghost btn-sm mt8" data-action="week-add-item" data-id="${d}" style="width:100%;justify-content:center;">+ 項目</button>
      <button class="btn btn-ghost btn-sm mt4" data-action="add-task-quick" data-date="${iso}" style="width:100%;justify-content:center;font-size:11px;">+ To-do</button>
    </div>`;
  }).join('');

  return `
  ${artPageBanner('calendar','📅 Organize','Calendar & Week','週視圖 · 月視圖 · To-do')}
  <div class="page-header">
    <div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
      <button class="btn ${view==='week'?'btn-primary':'btn-ghost'} btn-sm" data-action="planner-view" data-val="week">週視圖</button>
      <button class="btn ${view==='month'?'btn-primary':'btn-ghost'} btn-sm" data-action="planner-view" data-val="month">月視圖</button>
    </div>
  </div>

  <div class="panel" style="margin-bottom:16px;">
    <div class="panel-title" style="flex-wrap:wrap;gap:10px;">
      ${view==='week' ? `
        <div class="cal-nav">
          <button class="icon-btn" data-action="week-prev" title="上一週">←</button>
          <span style="font-family:var(--font-display);font-size:16px;">${fmtDateShort(weekStart)} – ${fmtDateShort(weekEnd)}</span>
          <button class="icon-btn" data-action="week-next" title="下一週">→</button>
        </div>
        <button class="btn btn-ghost btn-sm" data-action="week-this">本週</button>
      ` : `
        <div class="cal-nav">
          <button class="icon-btn" data-action="cal-prev-month">←</button>
          <span style="font-family:var(--font-display);font-size:16px;">${monthLabel}</span>
          <button class="icon-btn" data-action="cal-next-month">→</button>
        </div>
        <button class="btn btn-ghost btn-sm" data-action="cal-today">今天</button>
      `}
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
        <span class="fine">本週進度</span>
        <div class="progress-track" style="width:100px;"><div class="progress-fill" style="width:${prog.pct}%"></div></div>
        <span class="progress-pct">${prog.pct}%</span>
      </div>
    </div>
    <div class="fine">
      ${view==='week'
        ? '每一天可看到 To-do、行程與本週目標 · 週末深綠色 · 點日期可篩選下方清單'
        : '點日期查看／新增當日 To-do · 綠框為目前這一週'}
    </div>
  </div>

  ${view==='week' ? `
    <div class="week-grid">${weekCols}</div>
  ` : `
    <div class="panel">
      <div class="cal-grid">
        ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>`<div class="cal-dow ${i>=5?'weekend':''}">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
  `}

  ${selectedDate ? `
  <div class="panel mt20">
    <div class="panel-title">
      <span>${fmtDate(selectedDate)} 當日</span>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-primary btn-sm" data-action="add-task-quick" data-date="${selectedDate}">+ To-do</button>
        <button class="btn btn-ghost btn-sm" data-action="add-event-for-day" data-id="${selectedDate}">+ Event</button>
        <button class="btn btn-ghost btn-sm" data-action="planner-clear-day">清除選取</button>
      </div>
    </div>
    ${selectedEvents.length? selectedEvents.map(e=>`
      <div class="item-row">
        <input type="checkbox" class="checkbox" ${e.done?'checked':''} data-action="toggle-event-done" data-id="${e.id}">
        <div class="txt ${e.done?'done':''}">${e.time?`<b>${esc(e.time)}</b> · `:''}${esc(e.title)}</div>
        <button class="icon-btn" data-action="delete-event" data-id="${e.id}">✕</button>
      </div>
    `).join('') : `<div class="fine mb8">這天尚無 event</div>`}
    <hr class="divider">
    <div class="small-cap">To-do · ${selectedTasks.filter(t=>!t.completed).length} 未完成</div>
    ${selectedTasks.length? selectedTasks.map(tk=>taskRowHTML(tk)).join('') :
      `<div class="fine mt8">這天尚無 to-do · 按上方 + To-do 新增</div>`}
  </div>
  ` : ''}

  <div class="panel mt20" id="todoList">
    <div class="panel-title">
      <div>全部 To-do
        <span class="fine" style="margin-left:8px;">${doneTasks.length}/${db.tasks.length} 完成 · ${completionPct}%</span>
      </div>
      <button class="btn btn-ghost btn-sm" data-action="add-task-quick" data-date="">+ Add Task</button>
    </div>
    <div class="progress-row" style="margin-bottom:12px;">
      <div class="progress-track" style="flex:1"><div class="progress-fill" style="width:${completionPct}%"></div></div>
      <div class="progress-pct">${completionPct}%</div>
    </div>
    <div class="fine mb12">色點：<span style="color:#c0392b">●</span> Important · <span style="color:#2980b9">●</span> Routine · <span style="color:#d4a017">●</span> Special</div>
    ${allOpenTasks.length===0 && doneTasks.length===0
      ? `<div class="empty-state" style="padding:24px;"><div class="msg" style="font-size:14px;">尚無任務</div><button class="btn btn-primary btn-sm" data-action="add-task-quick">+ Add Task</button></div>`
      : allOpenTasks.concat(doneTasks).map(tk=>taskRowHTML(tk)).join('')}
  </div>
  `;
}

function taskRowHTML(tk){
  const tagColor = {important:'#c0392b', routine:'#2980b9', special:'#d4a017', '': 'transparent'}[tk.tag||''] || 'transparent';
  return `<div class="item-row">
    <input type="checkbox" class="checkbox" ${tk.completed?'checked':''} data-action="toggle-task" data-id="${tk.id}">
    <span title="${esc(tk.tag||'no tag')}" style="width:10px;height:10px;border-radius:50%;background:${tagColor};flex-shrink:0;display:inline-block;border:1px solid rgba(0,0,0,.12);"></span>
    <div class="txt ${tk.completed?'done':''}" contenteditable="true" data-bind="task.title::${tk.id}" data-bind-blur="1" style="flex:2;">${esc(tk.title)}</div>
    <select class="field" style="width:120px;" data-bind="task.tag::${tk.id}" title="Color tag">
      <option value="" ${!tk.tag?'selected':''}>Tag…</option>
      <option value="important" ${tk.tag==='important'?'selected':''}>● Important</option>
      <option value="routine" ${tk.tag==='routine'?'selected':''}>● Routine</option>
      <option value="special" ${tk.tag==='special'?'selected':''}>● Special</option>
    </select>
    <select class="field" style="width:100px;" data-bind="task.priority::${tk.id}">
      ${['Low','Normal','High'].map(p=>`<option ${tk.priority===p?'selected':''}>${p}</option>`).join('')}
    </select>
    <input type="date" class="field" style="width:140px;" value="${tk.dueDate||''}" data-bind="task.dueDate::${tk.id}">
    <div class="row-actions"><button class="icon-btn" data-action="delete-task" data-id="${tk.id}">✕</button></div>
  </div>`;
}
