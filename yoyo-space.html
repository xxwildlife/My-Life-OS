   ============================================================ */
const LB_SEASONS = [
  {key:'winter', label:'冬季 Winter', desc:'Cold-weather looks'},
  {key:'summer', label:'夏季 Summer', desc:'Hot-weather looks'},
  {key:'thin', label:'薄長袖 Thin long sleeves', desc:'Light long-sleeve outfits'}
];
function ensureLookbooks(){
  if(!Array.isArray(db.lookbooks)) db.lookbooks = [];
}
function findLook(id){ ensureLookbooks(); return db.lookbooks.find(x=>x.id===id); }
function emptyPart(){ return {text:'', photo:'', url:''}; }
function addLookbook(season, name){
  ensureLookbooks();
  const look = {
    id:uid(), season: season||'winter',
    name: (name&&name.trim()) ? name.trim() : ('LookBook ' + (db.lookbooks.filter(x=>x.season===(season||'winter')).length+1)),
    head:emptyPart(), upper:emptyPart(), lower:emptyPart(), accessories:emptyPart(),
    notes:'', url:'', photo:'',
    createdAt:Date.now(), updatedAt:Date.now()
  };
  db.lookbooks.unshift(look); persist(); return look;
}
function normalizeLook(l){
  ['head','upper','lower','accessories'].forEach(p=>{
    if(typeof l[p]==='string') l[p]={text:l[p], photo:'', url:''};
    if(!l[p] || typeof l[p]!=='object') l[p]=emptyPart();
    if(l[p].text==null) l[p].text='';
    if(l[p].photo==null) l[p].photo='';
    if(l[p].url==null) l[p].url='';
  });
  return l;
}
function deleteLookbook(id){
  ensureLookbooks();
  db.lookbooks = db.lookbooks.filter(x=>x.id!==id); persist();
}
function renderLookbook(route){
  ensureLookbooks();
  // #/lookbook/look/:id
  if(route[1]==='look' && route[2]) return renderLookDetail(route[2]);
  // #/lookbook/season/:key
  if(route[1]==='season' && route[2]) return renderLookSeason(route[2]);

  // root: three categories
  const counts = {};
  LB_SEASONS.forEach(s=> counts[s.key] = db.lookbooks.filter(l=>l.season===s.key).length);
  const q = (ui.lookbookQuery||'').trim().toLowerCase();
  const seasonAliases = {
    winter:['winter','冬','冬季'],
    summer:['summer','夏','夏季'],
    thin:['thin','薄','薄長袖','薄长袖','long sleeve','長袖']
  };
  const searchHits = q ? db.lookbooks.filter(l=>{
    normalizeLook(l);
    const seasonLabel = (LB_SEASONS.find(s=>s.key===l.season)||{}).label||l.season;
    const partsText = ['head','upper','lower','accessories'].map(p=> (l[p]&&l[p].text)||'').join(' ');
    const blob = [l.name, partsText, l.notes, l.url, l.season, seasonLabel].join(' ').toLowerCase();
    if(blob.includes(q)) return true;
    // match season keyword → filter that season
    for(const [key, aliases] of Object.entries(seasonAliases)){
      if(aliases.some(a=>q.includes(a)) && l.season===key) return true;
    }
    return false;
  }) : [];

  return `
  <div class="page-header">
    <div><div class="page-eyebrow">Style</div><div class="page-title">LookBook</div>
    <div class="page-sub">Folders by season · each saved look is a file with cover pic. Search by item or 冬/夏/薄長袖.</div></div>
  </div>
  <div class="panel">
    <div class="field-group" style="display:flex;gap:8px;margin:0;">
      <input class="field" id="lookbookSearchInput" type="text" placeholder="搜尋單品、套裝名稱，或 冬季 / 夏季 / 薄長袖…" value="${esc(ui.lookbookQuery)}" data-bind="lookbookQuery">
      <button class="btn btn-ghost btn-sm" data-action="lookbook-search">🔍 Search</button>
    </div>
  </div>
  ${q?`
    <div class="panel mt16">
      <div class="panel-title">Search results <span class="fine">${searchHits.length}</span>
        <button class="btn btn-ghost btn-sm" data-action="lookbook-clear-search">Clear</button>
      </div>
      ${searchHits.length===0?`<div class="fine">No matches.</div>`:`
      <div class="grid cols-3 mt12">
        ${searchHits.map(l=>{
          normalizeLook(l);
          const seasonLabel = (LB_SEASONS.find(s=>s.key===l.season)||{}).label||l.season;
          return `<div class="card card-click" onclick="location.hash='#/lookbook/look/${l.id}'" style="padding:0;overflow:hidden;">
            <div style="background:${l.photo?`url('${l.photo}') center/cover`:'linear-gradient(135deg,var(--verdigris),var(--gold))'};height:110px;"></div>
            <div style="padding:10px 12px;">
              <div style="font-family:var(--font-display);font-weight:600;font-size:15px;">${esc(l.name)}</div>
              <div class="fine mt4"><span class="pill pill-gray">${esc(seasonLabel)}</span></div>
            </div>
          </div>`;
        }).join('')}
      </div>`}
    </div>
  `:''}
  <div class="grid cols-3 mt16">
    ${LB_SEASONS.map(s=>`
      <div class="card card-click" onclick="location.hash='#/lookbook/season/${s.key}'">
        <div style="font-family:var(--font-display);font-weight:600;font-size:20px;">${s.label}</div>
        <div class="fine mt8">${s.desc}</div>
        <div class="pill pill-verd mt12">${counts[s.key]} look${counts[s.key]===1?'':'s'}</div>
      </div>
    `).join('')}
  </div>
  `;
}
function renderLookSeason(seasonKey){
  ensureLookbooks();
  const season = LB_SEASONS.find(s=>s.key===seasonKey) || {key:seasonKey, label:seasonKey, desc:''};
  // ALL books saved in this season folder
  const looks = db.lookbooks.filter(l=>l.season===seasonKey).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  return `
  <div class="breadcrumb"><a href="#/lookbook">LookBook</a><span class="sep">/</span><span>${esc(season.label)}</span></div>
  <div class="page-header">
    <div>
      <div class="page-eyebrow">資料夾 · 已儲存 ${looks.length} 本</div>
      <div class="page-title">${esc(season.label)}</div>
      <div class="page-sub">這裡是你存過的每一本 LookBook 封面。點封面打開整套穿搭；按「+ 新增」再存一本。</div>
    </div>
    <button class="btn btn-primary" data-action="add-look" data-id="${seasonKey}">+ 新增一本 LookBook</button>
  </div>
  ${looks.length===0?`
    <div class="empty-state">
      <div class="glyph">◎</div>
      <div class="msg">這個資料夾還沒有任何 LookBook</div>
      <div class="fine" style="margin-bottom:14px;">按下方按鈕新增 → 上傳封面與穿搭 → Save 後會出現在這裡</div>
      <button class="btn btn-primary" data-action="add-look" data-id="${seasonKey}">+ 新增第一本</button>
    </div>
  `:`
    <div class="fine" style="margin-bottom:12px;">共 ${looks.length} 本 · 點封面進入編輯</div>
    <div class="grid cols-3">
      ${looks.map(l=>{
        normalizeLook(l);
        const hasCover = !!(l.photo);
        return `
        <div class="card" style="padding:0;overflow:hidden;">
          <div onclick="location.hash='#/lookbook/look/${l.id}'" style="cursor:pointer;" title="Open this LookBook">
            <div style="height:140px;background:${hasCover?`url('${l.photo}') center/cover`:'linear-gradient(145deg,var(--verdigris),var(--gold))'};display:flex;align-items:center;justify-content:center;">
              ${hasCover?'':`<span style="color:var(--paper);font-family:var(--font-display);font-size:15px;opacity:.9;">尚無封面</span>`}
            </div>
            <div style="padding:12px 14px 4px;">
              <div style="font-family:var(--font-display);font-weight:600;font-size:17px;">${esc(l.name||'未命名 LookBook')}</div>
              <div class="fine mt4">${hasCover?'封面 · 點擊打開':'點擊補上封面與穿搭'}</div>
            </div>
          </div>
          <div style="padding:8px 14px 12px;display:flex;justify-content:space-between;align-items:center;">
            <span class="fine">${fmtDateShort(new Date(l.updatedAt||l.createdAt||Date.now()).toISOString().slice(0,10))}</span>
            <button class="btn btn-danger btn-sm" data-action="delete-look" data-id="${l.id}">刪除</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  `}
  `;
}
function lookPartBlock(l, partKey, partLabel){
  const p = l[partKey] || emptyPart();
  return `<div class="panel">
    <div class="panel-title">${partLabel}</div>
    ${p.photo?`
      <div style="border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--parchment);margin-bottom:8px;">
        <img src="${p.photo}" style="width:100%;height:100%;object-fit:cover;display:block;">
      </div>
      <button class="btn btn-ghost btn-sm" data-action="look-part-clear-photo" data-id="${l.id}" data-id2="${partKey}">Remove photo</button>
    `:''}
    <div class="field-group mt8">
      <label class="flabel">Upload from computer</label>
      <input type="file" accept="image/*" class="lookPartImgInput field" data-lid="${l.id}" data-part="${partKey}">
    </div>
    <div class="field-group mt8"><label class="flabel">Notes</label>
      <textarea class="field" rows="2" data-bind="lookpart.text::${l.id}::${partKey}" placeholder="Description…">${esc(p.text)}</textarea>
    </div>
    <div class="field-group"><label class="flabel">URL</label>
      <input class="field" value="${esc(p.url)}" data-bind="lookpart.url::${l.id}::${partKey}" placeholder="https://…">
    </div>
  </div>`;
}
function renderLookDetail(id){
  let l = findLook(id);
  if(!l) return `<div class="empty-state"><div class="msg">Look not found.</div><a class="btn btn-primary" href="#/lookbook">Back</a></div>`;
  l = normalizeLook(l);
  const season = LB_SEASONS.find(s=>s.key===l.season);
  return `
  <div class="breadcrumb"><a href="#/lookbook">LookBook</a><span class="sep">/</span><a href="#/lookbook/season/${l.season}">${esc(season?season.label:l.season)}</a><span class="sep">/</span><span>${esc(l.name)}</span></div>
  <div class="page-header">
    <div contenteditable="true" class="page-title" data-bind="look.name::${l.id}" data-bind-blur="1">${esc(l.name)}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" data-action="save-look" data-id="${l.id}">Save LookBook ✓</button>
      <a class="btn btn-ghost btn-sm" href="#/lookbook/season/${l.season}">← Back to folder</a>
      <button class="btn btn-danger btn-sm" data-action="delete-look" data-id="${l.id}">Delete</button>
    </div>
  </div>
  <div class="grid cols-2">
    <div class="panel">
      <div class="small-cap">Cover photo（從電腦上傳）</div>
      ${l.photo?`
        <div style="margin-top:10px;height:180px;border-radius:8px;background:url('${l.photo}') center/cover;border:1px solid var(--line);"></div>
        <button class="btn btn-ghost btn-sm mt8" data-action="look-clear-photo" data-id="${l.id}">Remove cover</button>
      `:''}
      <div class="field-group mt12">
        <label class="flabel">Upload from your computer</label>
        <input type="file" accept="image/*" class="lookDetailImgInput field" data-lid="${l.id}">
        <div class="fine mt8">Select a photo from your device (JPG / PNG, under 8MB). This becomes the book cover.</div>
      </div>
    </div>
    <div class="panel">
      <div class="field-group"><label class="flabel">Season folder</label>
        <select class="field" data-bind="look.season::${l.id}">
          ${LB_SEASONS.map(s=>`<option value="${s.key}" ${l.season===s.key?'selected':''}>${s.label}</option>`).join('')}
        </select>
      </div>
      <div class="field-group"><label class="flabel">Overall URL</label>
        <input class="field" value="${esc(l.url)}" data-bind="look.url::${l.id}" placeholder="https://…">
      </div>
      <div class="field-group"><label class="flabel">Overall Notes</label>
        <textarea class="field" rows="4" data-bind="look.notes::${l.id}" placeholder="Style notes for this whole look…">${esc(l.notes)}</textarea>
      </div>
    </div>
  </div>
  <div class="grid cols-2 mt16">
    ${lookPartBlock(l,'head','頭部 Head')}
    ${lookPartBlock(l,'upper','上身 Upper')}
    ${lookPartBlock(l,'lower','下身 / 腳 Lower & feet')}
    ${lookPartBlock(l,'accessories','配件 Accessories')}
  </div>
  <div class="mt16" style="display:flex;gap:8px;flex-wrap:wrap;">
    <button class="btn btn-primary" data-action="save-look" data-id="${l.id}">Save LookBook ✓</button>
    <a class="btn btn-ghost" href="#/lookbook/season/${l.season}">← Back to folder</a>
  </div>
  `;
}

function renderWatchlist(route){
  ensureWatchlist();
  if(route && route[1]) return renderWatchDetail(route[1]);

  const q = (ui.watchQuery||'').trim().toLowerCase();
  const catF = ui.watchFilter || 'all';
  const stF = ui.watchStatus || 'all';
  let items = [...db.watchlist];
  if(catF!=='all') items = items.filter(w=>w.category===catF);
  if(stF!=='all') items = items.filter(w=>w.status===stF);
  if(q) items = items.filter(w=>{
    const blob = [w.title,w.channel,w.category,w.synopsis,w.url].join(' ').toLowerCase();
    return blob.includes(q);
  });
  items.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));

  const statusLabel = {want:'想看', watching:'在看', done:'看完'};
  const statusPill = {want:'pill-gold', watching:'pill-verd', done:'pill-gray'};

  return `
  ${artPageBanner('watch','🍿 Cinema','Watchlist','待看片單 · 點片名看詳情')}
  <div class="page-header">
    <div></div>
    <button class="btn btn-primary" data-action="add-watch">+ 🍿 新增片單</button>
  </div>

  <div class="panel" style="margin-bottom:16px;">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <input class="field" id="watchSearchInput" style="flex:1;min-width:160px;" type="text" placeholder="搜尋片名、渠道、大綱…" value="${esc(ui.watchQuery)}" data-bind="watchQuery">
      <button class="btn btn-ghost btn-sm" data-action="watch-search">🔍 Search</button>
      <select class="field" style="width:160px;" data-bind="watchFilter">
        <option value="all" ${catF==='all'?'selected':''}>全部分類</option>
        ${db.watchCategories.map(c=>`<option value="${esc(c)}" ${catF===c?'selected':''}>${esc(c)}</option>`).join('')}
      </select>
      <select class="field" style="width:120px;" data-bind="watchStatus">
        <option value="all" ${stF==='all'?'selected':''}>全部狀態</option>
        <option value="want" ${stF==='want'?'selected':''}>想看</option>
        <option value="watching" ${stF==='watching'?'selected':''}>在看</option>
        <option value="done" ${stF==='done'?'selected':''}>看完</option>
      </select>
      <button class="btn btn-ghost btn-sm" data-action="add-watch-category">+ 分類</button>
      <button class="btn btn-ghost btn-sm" data-action="watch-clear-filter">清除</button>
    </div>
    <div class="fine mt8">${items.length} 部 · 共 ${db.watchlist.length} 部</div>
  </div>

  ${db.watchlist.length===0?`
    <div class="empty-state">
      <div class="glyph">🍿</div>
      <div class="msg">片單還是空的</div>
      <button class="btn btn-primary" data-action="add-watch">+ 🍿 第一部</button>
    </div>
  `: items.length===0?`
    <div class="empty-state"><div class="msg">沒有符合篩選的片單</div>
      <button class="btn btn-ghost" data-action="watch-clear-filter">清除篩選</button></div>
  `:`
    <div class="grid cols-3">
      ${items.map(w=>{
        const st = w.status||'want';
        return `
        <div class="card card-click" data-action="open-watch-view" data-id="${w.id}" style="padding:16px 18px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div style="font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1.3;flex:1;min-width:0;">
              ${esc(w.title)||'未命名'}
            </div>
            <span class="pill ${statusPill[st]||'pill-gray'}">${statusLabel[st]||st}</span>
          </div>
          <div class="fine mt8" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
            ${w.category?`<span class="pill pill-gold">${esc(w.category)}</span>`:''}
            ${w.channel?`<span>${esc(w.channel)}</span>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>
  `}
  `;
}

        <div class="glyph">✨</div>
        <div class="msg">還沒有願望</div>
        <button class="btn btn-primary" data-action="add-wish">+ ✨ 新增願望</button>

        <div class="item-row" style="cursor:pointer;" data-action="open-wish" data-id="${w.id}">

        </div>
      `).join('')}

          <div class="txt done"><b>${esc(w.name)}</b></div>

}

function moveTripItemToDay(tripId, fromDayId, itemId, toDayId){
  const trip = findTrip(tripId); if(!trip) return;
  const from = trip.days.find(d=>d.id===fromDayId);
  const to = trip.days.find(d=>d.id===toDayId);
  if(!from || !to || fromDayId===toDayId) return;
  const idx = from.items.findIndex(x=>x.id===itemId);
  if(idx<0) return;
  const [item] = from.items.splice(idx,1);
  to.items.push(item);
  persist();
}
function wireTripDrag(){
  const items = document.querySelectorAll('#tripTimeline .trip-drag-item');
  items.forEach(el=>{
    if(el._dragWired) return;
    el._dragWired = true;
    el.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', JSON.stringify({
        tripId: el.getAttribute('data-trip'),
        itemId: el.getAttribute('data-item'),
        fromIdx: parseInt(el.getAttribute('data-idx'),10)
      }));
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over')); });
    el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', ()=> el.classList.remove('drag-over'));
    el.addEventListener('drop', e=>{
      e.preventDefault();
      el.classList.remove('drag-over');
      try{
        const data = JSON.parse(e.dataTransfer.getData('text/plain'));
        const toIdx = parseInt(el.getAttribute('data-idx'),10);
        if(data.itemId && data.tripId){
          moveTimelineItem(data.tripId, data.itemId, toIdx);
          render();
        }
      }catch(err){}
    });
  });
}

function flushReviewCheckInputs(){
  document.querySelectorAll('[data-bind^="reviewcheck."]').forEach(el=>{
    const spec = el.getAttribute('data-bind');
    if(!spec) return;
    const parts = spec.split('::');
    const ym = parts[1], ck = parts[2], itemId = parts[3];
    if(!ym || !ck || !itemId) return;
    const rv = ensureReview(ym);
    if(!rv.checklists[ck]) rv.checklists[ck] = [];
    const it = rv.checklists[ck].find(x=>x.id===itemId);
    if(it){
      const isCE = el.isContentEditable || el.getAttribute('contenteditable')==='true';
      it.text = isCE ? (el.innerText||'') : (el.value||'');
    }
  });
  // also flush collection textarea
  document.querySelectorAll('[data-bind^="review.collection"]').forEach(el=>{
    const parts = el.getAttribute('data-bind').split('::');
    const ym = parts[1]; if(!ym) return;
    ensureReview(ym);
    db.monthlyReviews[ym].collection = el.value||'';
  });
}
function ensureReview(ym){
  if(!db.monthlyReviews[ym]){
    db.monthlyReviews[ym] = {
      goals:'', achievements:'', wrong:'', favorite:'', nextGoals:'',
      collection:'',
      checklists: { goals:[], achievements:[], wrong:[], favorite:[], nextGoals:[] }
    };
  }
  const d = db.monthlyReviews[ym];
  if(!d.checklists) d.checklists = {};
  const keys = ['goals','achievements','wrong','favorite','nextGoals'];
  keys.forEach(k=>{
    if(!Array.isArray(d.checklists[k])){
      const old = d[k];
      d.checklists[k] = (old && String(old).trim())
        ? [{ id: uid(), text: String(old).trim(), done: false }]
        : [];
    } else if(d.checklists[k].length===0 && d[k] && String(d[k]).trim()){
      // recover text that was never migrated into checklist
      d.checklists[k] = [{ id: uid(), text: String(d[k]).trim(), done: false }];
    }
  });
  if(d.collection==null) d.collection='';
  return d;
}
function reviewAddCheckItem(ym, key){

function reviewToggleCheckItem(ym, key, itemId){

function ymShift(ym, delta){
  const [y,m]=ym.split('-').map(Number);
  const d=new Date(y, m-1+delta, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function renderMood(){
  const monthYm = todayISO().slice(0,7);
  const thisMonth = db.moods.filter(m=>m.date.startsWith(monthYm));
  const freq = {};
  MOOD_OPTS.forEach(o=>freq[o.v]=0);
  thisMonth.forEach(m=>{ if(freq[m.mood]!==undefined) freq[m.mood]++; });
  const recent = [...db.moods].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20);
  const today = todayISO();
  const todaysMood = db.moods.find(m=>m.date===today);
  const journalDate = ui.journalViewDate || today;
  const journal = getJournalForDate(journalDate);
  const q = (ui.journalQuery||'').trim().toLowerCase();
  let journals = [...db.journals].filter(j=>j.content||j.title).sort((a,b)=>b.date.localeCompare(a.date));
  if(q){
    journals = journals.filter(j=>{
      const blob = ((j.title||'')+' '+(j.content||'')+' '+(j.date||'')).toLowerCase();
      return blob.includes(q);
    });

      ${emojiDrill?`

function renderSearch(route){

  return `

}

function renderModal(){
  const md = ui.modal;
  if(!md) return '';
  if(md.type==='confirm'){
    return `<div class="overlay" data-action="close-modal">
      <div class="modal">
        <h3>Please confirm</h3>
        <p class="fine" style="font-size:14px;">${esc(md.msg)}</p>
        <div class="modal-actions">
          <button class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button class="btn btn-danger" data-action="modal-confirm-yes">Delete</button>
        </div>
      </div>
    </div>`;
  }
  if(md.type==='journalView'){
    return `<div class="overlay" data-action="close-modal">
      <div class="modal modal-lg">
        <div class="small-cap">${fmtDate(md.date)}</div>
        <h3 style="margin:4px 0 12px;">${esc(md.title)||'Untitled Journal'}</h3>
        <hr class="divider">
        <div style="white-space:pre-wrap; font-size:15px; line-height:1.6; min-height:120px;">${esc(md.content)||'<span class="fine">No content written.</span>'}</div>
        <div class="fine mt16">Click outside to close</div>
      </div>
    </div>`;
  }
  if(md.type==='day'){
    const date = md.date;
    const dayTasks = db.tasks.filter(t=>t.dueDate===date);
    const doneCount = dayTasks.filter(t=>t.completed).length;
    const pct = dayTasks.length ? Math.round(doneCount/dayTasks.length*100) : 0;
    const tagColor = {important:'#c0392b', routine:'#2980b9', special:'#d4a017', '': 'transparent'};
    return `<div class="overlay" data-action="close-modal">
      <div class="modal modal-lg">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h3 style="margin:0;">To-do · ${fmtDate(date)}</h3>
          <button class="icon-btn" data-action="close-modal" style="font-size:18px;">✕</button>
        </div>
        <div class="fine mt8"><span style="color:#c0392b">●</span> Important · <span style="color:#2980b9">●</span> Routine · <span style="color:#d4a017">●</span> Special</div>
        ${dayTasks.length?`
          <div class="progress-row mt12"><div class="progress-track" style="flex:1"><div class="progress-fill" style="width:${pct}%"></div></div><div class="progress-pct">${pct}%</div></div>
          <div class="fine mt8">${doneCount} / ${dayTasks.length} complete</div>
        `:''}
        <hr class="divider">
        ${dayTasks.length?dayTasks.map(tk=>`
          <div class="item-row">
            <input type="checkbox" class="checkbox" ${tk.completed?'checked':''} data-action="toggle-task" data-id="${tk.id}">
            <span style="width:10px;height:10px;border-radius:50%;background:${tagColor[tk.tag||'']||'transparent'};flex-shrink:0;display:inline-block;border:1px solid rgba(0,0,0,.12);"></span>
            <div class="txt ${tk.completed?'done':''}" contenteditable="true" data-bind="task.title::${tk.id}" data-bind-blur="1" style="flex:1;">${esc(tk.title)}</div>
            <select class="field" style="width:110px;" data-bind="task.tag::${tk.id}">
              <option value="" ${!tk.tag?'selected':''}>Tag…</option>
              <option value="important" ${tk.tag==='important'?'selected':''}>● Important</option>
              <option value="routine" ${tk.tag==='routine'?'selected':''}>● Routine</option>
              <option value="special" ${tk.tag==='special'?'selected':''}>● Special</option>
            </select>
            <div class="row-actions" style="opacity:1;"><button class="icon-btn" data-action="delete-task" data-id="${tk.id}">✕</button></div>
          </div>`).join(''):`<div class="empty-state" style="padding:20px;"><div class="msg" style="font-size:14px;">No tasks for this date</div></div>`}
        <div style="display:flex;gap:8px;flex-wrap:wrap;" class="mt12">
          <button class="btn btn-primary" data-action="add-task-quick" data-date="${date}">+ Add Task</button>
        </div>
        <div class="modal-actions">
          <button class="btn btn-primary" data-action="close-modal">Save &amp; Close</button>
        </div>
      </div>
    </div>`;
  }
  if(md.type==='galleryPhoto'){
    const ph=findGalleryPhoto(md.albumId,md.photoId);
    const al=findGalleryAlbum(md.albumId);
    if(!ph||!al){ ui.modal=null; return ''; }
    return `<div class="overlay" data-action="close-modal">
      <div class="modal modal-lg">
        <div class="panel-title"><div>${esc(ph.name)}</div><button class="icon-btn" data-action="close-modal">✕</button></div>
        <div class="gallery-photo-layout">
          <div class="gallery-photo-view"><img data-gallery-modal-key="${ph.blobKey}" alt="${esc(ph.name)}"></div>
          <div>
            <div class="sticky-note">

              <textarea id="galleryNoteInput" data-bind="gallery.note::${al.id}::${ph.id}" placeholder="Write a memory, location, people, story…">${esc(ph.note)}</textarea>

            <button class="btn btn-primary mt12" data-action="gallery-save-note" data-id="${al.id}" data-id2="${ph.id}">Save Note ✓</button>
            <button class="btn btn-ghost mt8" data-action="gallery-download-photo" data-id="${al.id}" data-id2="${ph.id}">↓ Download Original</button>
            <button class="btn btn-danger mt8" data-action="gallery-delete-photo" data-id="${al.id}" data-id2="${ph.id}">Delete Photo</button>
          </div>
        </div>
      </div>
    </div>`;

      <div class="modal">

        <div class="field-group"><label class="flabel">若選新本，名稱</label>

          <button type="button" class="btn btn-primary" data-action="travel-quick-submit">加入 ✓</button>

  }
if(md.type==='wishForm'){
    const w = findWish(md.wishId);

  }
  if(md.type==='watchView'){
    const w = findWatch(md.watchId);
    if(!w){ ui.modal=null; return ''; }
    const st = w.status||'want';
    const statusLabel = {want:'想看', watching:'在看', done:'看完'};
    const gUrl = watchSearchUrl(w.title);
    const wikiUrl = watchWikiUrl(w.title);
    const titleHref = w.url ? esc(w.url) : gUrl;
    return `<div class="overlay" data-action="close-modal">
      <div class="modal modal-lg">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
          <div>
            <div class="small-cap">🍿 Watchlist</div>
            <h3 style="margin:4px 0 0;"><a href="${titleHref}" target="_blank" rel="noopener" style="color:var(--verdigris-deep);text-decoration:none;">${esc(w.title)||'未命名'}</a></h3>
            <div class="fine mt8">
              <span class="pill pill-gold">${esc(w.category||'')}</span>
              <span class="pill pill-gray">${statusLabel[st]||st}</span>
              ${w.channel?` · ${esc(w.channel)}`:''}
            </div>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" data-action="close-modal">✕</button>
        </div>
        <hr class="divider">
        <div class="small-cap">大綱 / 備註</div>
        <div style="white-space:pre-wrap;font-size:15px;line-height:1.55;min-height:60px;margin-top:6px;">${esc(w.synopsis)||'<span class="fine">尚未填寫</span>'}</div>
        <div class="fine mt12">
          <a href="${gUrl}" target="_blank" rel="noopener">Google</a> ·
          <a href="${wikiUrl}" target="_blank" rel="noopener">Wiki</a>
          ${w.url?` · <a href="${esc(w.url)}" target="_blank" rel="noopener">自訂連結</a>`:''}
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">關閉</button>
          <button type="button" class="btn btn-primary" data-action="edit-watch" data-id="${w.id}">編輯 ✎</button>
        </div>
      </div>
    </div>`;
  }
if(md.type==='weatherForecast'){
    const w = md.weather;
    const days = (w && w.daily) ? w.daily : [];
    const t = w && w.temp!=null ? Math.round(w.temp)+'°C' : '—';
    return `<div class="overlay" data-action="close-modal">
      <div class="modal modal-lg" data-stop="1">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
          <div>
            <div class="small-cap">台中市北區</div>
            <h3 style="margin:4px 0 0;">${w? (w.emoji||'🌡️')+' '+t+' · '+(w.label||'') : '天氣'}</h3>
            <div class="fine mt4">未來 7 天預報 · Open-Meteo</div>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" data-action="close-modal">✕ 關閉</button>
        </div>
        <div class="grid cols-4 mt16" style="gap:8px;">
          ${days.length? days.map(d=>{
            const lab = new Date(d.date+'T12:00:00').toLocaleDateString('zh-TW',{weekday:'short',month:'numeric',day:'numeric'});
            const isToday = d.date===todayISO();
            return `<div class="card" style="padding:12px;text-align:center;${isToday?'border-color:var(--matcha);':''}">
              <div class="fine">${lab}${isToday?' · 今天':''}</div>
              <div style="font-size:28px;margin:6px 0;">${d.emoji||'🌡️'}</div>
              <div class="fine">${esc(d.label||'')}</div>
              <div style="font-family:var(--font-ui);font-weight:600;margin-top:6px;font-size:13px;">
                ${d.tmax!=null?Math.round(d.tmax)+'°':''}<span class="fine"> / </span>${d.tmin!=null?Math.round(d.tmin)+'°':''}
              </div>
            </div>`;
          }).join('') : `<div class="fine">尚無預報資料，請稍後再試或檢查網路</div>`}
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" data-action="weather-force-refresh">重新整理 🔄</button>
          <button class="btn btn-primary" data-action="close-modal">關閉</button>
        </div>
      </div>
    </div>`;
  }
if(md.type==='recipeDice'){
    return `<div class="overlay" data-action="close-modal">
      <div class="modal" onclick="event.stopPropagation()">
        <div style="text-align:center;font-size:40px;margin-bottom:8px;">🎲</div>
        <h3 style="text-align:center;margin-bottom:6px;">${esc(md.line||'今天吃這個！')}</h3>
        <div style="text-align:center;font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--verdigris-deep);margin:12px 0;">
          ${esc(md.title)}
        </div>
        ${md.image?`<div style="height:140px;border-radius:10px;background:url('${md.image}') center/cover;margin:12px 0;"></div>`:''}
        <div class="modal-actions" style="justify-content:center;">
          <button class="btn btn-ghost" data-action="recipe-dice">再骰一次 🎲</button>
          <a class="btn btn-primary" href="#/recipes/${md.recipeId}" data-action="close-modal">打開食譜 →</a>
        </div>
      </div>
    </div>`;
  }
  if(md.type==='quickadd'){
    const kinds = [['task','Task'],['goal','Learning Goal'],['idea','Video Idea'],['recipe','Recipe'],['trip','Trip'],['event','Calendar Event'],['note','Note']];
    return `<div class="overlay" data-action="close-modal">
      <div class="modal">
        <h3>Quick Add</h3>
        <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;">
          ${kinds.map(([v,l])=>`<button class="btn ${md.kind===v?'btn-primary':'btn-ghost'} btn-sm" data-action="quickadd-set-kind" data-val="${v}">${l}</button>`).join('')}
        </div>
        <form id="quickaddForm" onsubmit="event.preventDefault(); quickAddSubmit();">
          <div class="field-group">
            <label class="flabel">${md.kind==='note'?'Note text':'Title'}</label>
            <input id="firstFocus" class="field" name="title" ${md.kind==='note'?'':'placeholder="Title"'} autocomplete="off">
          </div>
          ${(md.kind==='task'||md.kind==='event')? `
          <div class="field-group"><label class="flabel">Date</label><input class="field" type="date" name="dueDate" value="${todayISO()}"></div>` : ''}
          ${md.kind==='task'? `
          <div class="field-group"><label class="flabel">Priority</label>
            <select class="field" name="priority"><option>Low</option><option selected>Normal</option><option>High</option></select>
          </div>
          <div class="field-group"><label class="flabel">Category</label><input class="field" name="category" placeholder="optional"></div>` : ''}
        </form>
        <div class="modal-actions">
          <button class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button class="btn btn-primary" data-action="quickadd-submit">Add</button>
        </div>
      </div>
    </div>`;
  }
  return '';
}

function handleBindBlur(el,e){
  // contenteditable elements use innerText; ensure DB updated on blur too (covers cases where 'input' event granularity differs)
  const spec = el.getAttribute('data-bind');
  if(!spec) return;
  const fakeEl = { getAttribute:()=>spec, value: el.innerText!==undefined? el.innerText : el.value, type:'text' };
  handleBind(fakeEl, e);
  persist();
}

/* ---------------- Boot ---------------- */
render();
</script>
</body>
</html>
